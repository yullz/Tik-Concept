- episode_id: ep002-moon-is-gone
  file_number: FILE B-0002
  title: The Moon Is Gone
  platform: tiktok
  scheduled_local: '2026-10-21T07:00:00+03:00'
  scheduled_utc: '2026-10-21T04:00:00Z'
  bundle: /home/user/Tik-Concept/renders/ep002-moon-is-gone/publish/ep002-moon-is-gone.mp4
  caption_title: What if the Moon vanished tonight. (Tomorrow Morning · 02)
  pinned_comment: The tide. Not the water, the fisheries. Estuaries are nurseries
    for most of what we eat from the sea, and they run on tidal mixing. The dark is
    a mood; the tilt is a million years away. Argue.
  second_comment: 'The dark, and fast. Insect navigation, nocturnal pollination, turtle
    hatchlings, coral spawning: the night ecosystem is the first thing that breaks,
    and we eat what it feeds.'
