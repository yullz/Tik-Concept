  caption_title: What if every human vanished tonight. (Tomorrow Morning · 01)
  pinned_comment: The probe. The pyramids erode in a few million years, plastic breaks
    down in a few thousand, but Voyager is outside the solar system with nothing to
    touch it. In a billion years the only proof we existed is a gold record.
  second_comment: 'The plastic. Not a bottle, the layer: a thin band of polymer in
    the rock of every continent, the same way the dinosaurs left an iridium line.
    The pyramids are a monument. The plastic is a fossil.'
