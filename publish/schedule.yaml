- episode_id: ep003-earth-stops-spinning
  file_number: FILE B-0003
  title: The Earth Stops Spinning
  platform: tiktok
  scheduled_local: '2026-10-21T18:00:00+03:00'
  scheduled_utc: '2026-10-21T15:00:00Z'
  bundle: /home/user/Tik-Concept/renders/ep003-earth-stops-spinning/publish/ep003-earth-stops-spinning.mp4
  caption_title: What if the Earth stopped spinning. (Tomorrow Morning · 03)
  pinned_comment: Night side. The day side is a six-month furnace with no shade; the
    night side has aurora, ice to melt for water, and geothermal heat if you dig.
    Humans have wintered in Antarctica for a century. Nobody has summered on Venus.
  second_comment: Day side, obviously. Plants need light, and you can make shade;
    you cannot make a sun. The night side starves in a season. Every colony in history
    was built where things grow.
