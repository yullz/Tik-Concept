- episode_id: ep009-the-sun-goes-out
  file_number: FILE B-0009
  title: The Sun Goes Out
  platform: tiktok
  scheduled_local: '2026-10-24T18:00:00+03:00'
  scheduled_utc: '2026-10-24T15:00:00Z'
  bundle: /home/user/Tik-Concept/renders/ep009-the-sun-goes-out/publish/ep009-the-sun-goes-out.mp4
  caption_title: What if the Sun went out tonight. (Tomorrow Morning · 09)
  pinned_comment: The volcano. Iceland already heats its homes and grows tomatoes
    on geothermal steam, and a reactor can run the lamps for decades. The deep sea
    feeds crabs. It does not feed ten thousand people.
  second_comment: The deep. Vent ecosystems have run on the Earth's own heat for billions
    of years without a sun; a volcano is a surface bet in a world that is cooling
    toward minus two hundred. Go where the heat comes from.
