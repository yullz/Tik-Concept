- episode_id: ep005-internet-goes-dark
  file_number: FILE B-0005
  title: The Internet Goes Dark for a Year
  platform: tiktok
  scheduled_local: '2026-10-22T18:00:00+03:00'
  scheduled_utc: '2026-10-22T15:00:00Z'
  bundle: /home/user/Tik-Concept/renders/ep005-internet-goes-dark/publish/ep005-internet-goes-dark.mp4
  caption_title: What if the internet went dark tonight. (Tomorrow Morning · 05)
  pinned_comment: 'The city. Cities are machines that run on connection: food arrives
    by the hour, money is a number, and nobody knows their neighbour. A village has
    a shop with a tab and a man with a radio. Change my mind.'
  second_comment: The village. The city has the hospital, the warehouse and the mayor;
    the village has a pharmacy that gets its orders from a server in the city. When
    the warnings stop, the far end of the line hears last.
