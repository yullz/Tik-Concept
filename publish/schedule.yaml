- episode_id: ep006-one-hour-of-sleep
  file_number: FILE B-0006
  title: Sleep Takes One Hour
  platform: tiktok
  scheduled_local: '2026-10-23T07:00:00+03:00'
  scheduled_utc: '2026-10-23T04:00:00Z'
  bundle: /home/user/Tik-Concept/renders/ep006-one-hour-of-sleep/publish/ep006-one-hour-of-sleep.mp4
  caption_title: What if sleep took one hour. (Tomorrow Morning · 06)
  pinned_comment: More work. Every hour humans have ever freed up, from the loom to
    the dishwasher, got filled by a job within a generation. Seven hours a day is
    the biggest productivity gain in history, and it will not be yours.
  second_comment: More freedom. A hundred extra days a year and the first thing to
    die is the alarm clock. Work expands to fill the day only if we let it, and a
    planet that is never tired has time to argue about that.
