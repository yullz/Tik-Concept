- episode_id: ep004-all-the-ice-melts
  file_number: FILE B-0004
  title: All the Ice Melts This Week
  platform: tiktok
  scheduled_local: '2026-10-22T07:00:00+03:00'
  scheduled_utc: '2026-10-22T04:00:00Z'
  bundle: /home/user/Tik-Concept/renders/ep004-all-the-ice-melts/publish/ep004-all-the-ice-melts.mp4
  caption_title: What if all the ice melted this week. (Tomorrow Morning · 04)
  pinned_comment: South. A continent the size of Europe and America together, no owners,
    no borders, and the only fresh ice left on Earth. Antarctica in this timeline
    is the only place that is not already full.
  second_comment: Uphill. Antarctica is bare rock with six months of night and no
    soil; moss takes centuries. You cannot farm a continent that has never had a worm
    in it. Go where the dirt is.
