look_key_prompt: >-
  empty establishing frame of a high desert plateau at dawn with a large radio dish turning against a violet sky,
  frost on the gravel, a low concrete control building with one lit window, thin cold air
research:
  hinge: >-
    Tomorrow a radio observatory detects a narrow-band signal with a non-natural structure from a star about forty
    light-years away; a second observatory confirms it, which is the step the international post-detection protocol
    requires before announcing it to the world.
  hinge_date: tomorrow
  sources:
  - >-
    International Academy of Astronautics, Declaration of Principles Concerning Activities Following the Detection
    of Extraterrestrial Intelligence (1989; revised 2010): confirm with independent observers, then inform the public
    and the UN
  - >-
    Almar & Tarter, The discovery of ETI as a high-consequence, low-probability event: the Rio Scale (2000)
  - >-
    Gillon et al., Seven temperate terrestrial planets around the nearby ultracool dwarf star TRAPPIST-1, Nature
    542 (2017): about forty light-years away
  - >-
    The Arecibo message of 1974 and the 1977 Wow! signal (Ohio State Big Ear), as the two reference events
  - >-
    Vakoch (ed.), Extraterrestrial Altruism (2014) and the 2015 statement by Hawking and others cautioning against
    active transmission, for the METI debate
  facts:
  - >-
    A signal from forty light-years away is forty years old when it arrives; a reply takes forty more to get there.
  - >-
    The protocol asks for independent confirmation before any announcement, and for no reply without international
    consultation.
  - >-
    A sequence of prime numbers is the textbook sign of a made signal, because no known natural process produces
    one.
  - >-
    Television and radar have leaked from Earth since the nineteen thirties; the strongest signals are only a few
    decades out.
  - >-
    Nothing in daily life changes when the signal arrives; markets have fallen and recovered on far less.
  era_sheet:
    timeline: 'the present day: day one, year one, year ten'
    architecture: >-
      a high-desert observatory with one large dish and a low control building, a second dish array on a plain,
      a trading floor, a cathedral square, an assembly hall, a 1930s television studio
    clothing: parkas and headsets at the observatory, suits, robes, ordinary clothes in the square
    vehicles: a pickup on the plateau road, none else
    street: >-
      a paper spectrum printout, a telephone handset, a brass star globe, punched paper tape, candles, a brass transmit
      key
    light: >-
      violet high-desert dawn, cold control-room screens kept dark or blurred, warm candlelight, Milky Way nights
    palette: desert grey, dish white, violet dawn, deep cyan accent
    forbidden: aliens, spaceships, green lights, glowing UFOs, text on screens, Hollywood panic
  cost: >-
    The signal left its star forty years ago. Whoever sent it may be gone, and whatever we send reaches their grandchildren;
    a decade is spent deciding what to say to the dead.
beats:
- id: hook
  vo: >-
    What if the signal came tomorrow. A radio telescope in Chile hears a pattern that nature cannot make. It repeats
    every twenty-three hours. It is forty light-years away.
  card:
    text: WHAT IF THE SIGNAL CAME TOMORROW
    style: title
- id: hinge
  vo: >-
    The protocol was written in nineteen eighty-nine: confirm with a second telescope, then tell the world. Here,
    the second telescope hears it too. This is how it happens.
  card:
    text: TOMORROW · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day one. Every dish on Earth turns to one star. The pattern is prime numbers, so it is not a pulsar and not
    a prank. The markets fall nine percent and recover by Friday, because nothing has changed.
  card:
    text: DAY ONE
    style: phase
- id: phase2
  vo: >-
    Year one. The signal keeps coming, saying nothing new. Churches fill, then empty. A reply takes forty years
    to arrive and forty more to answer, so the fight is over who speaks for Earth.
  card:
    text: YEAR ONE
    style: phase
- id: phase3
  vo: >-
    Year ten. No reply sent. One camp says they already hear our television, leaking since the nineteen thirties.
    The other says that is exactly why we should go quiet.
  card:
    text: YEAR TEN
    style: phase
- id: turn
  vo: >-
    [exhale] But the signal left its star forty years ago. Whoever sent it may be gone, and whatever we send reaches
    their grandchildren. We spent ten years deciding what to say to the dead.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. The dish is pointed, the message written. Do we send it?
  card:
    text: The dish is pointed, the message is written. Do we send it?
    style: question
