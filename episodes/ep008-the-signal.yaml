dilemma: The dish is pointed, the message is written. Do we send it?
pinned_comment: >-
  Send it. Our television has been leaking for ninety years; anyone who can hear a signal from forty light-years
  away already knows exactly where we are. Silence buys nothing. Manners might.
metadata:
  cover_time: 0.8
  second_comment: >-
    Do not send it. A faint television leak is not a message, and a message is an address. Every species that ever
    shouted into a dark forest learned the same lesson. We do not know who is listening.
