dilemma: The day side, or the night side?
pinned_comment: >-
  Night side. The day side is a six-month furnace with no shade; the night side has ice to melt for water,
  and geothermal heat if you dig. Humans have wintered in Antarctica for a century. Nobody has summered on Venus.
metadata:
  cover_time: 3.4
  second_comment: >-
    Day side, obviously. Plants need light, and you can make shade; you cannot make a sun. The night side starves
    in a season. Every colony in history was built where things grow.
