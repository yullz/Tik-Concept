research:
  hinge: >-
    The Earth's rotation slows to a complete stop over one year. An instant stop would hurl everything at the surface
    eastward at up to sixteen hundred kilometres an hour; the gradual version is survivable and far stranger, because
    the spin was also holding the oceans in shape and stirring the core.
  hinge_date: tonight, over one year
  sources:
  - >-
    NASA, Earth Fact Sheet: equatorial rotation speed about 1,670 km/h; equatorial radius exceeds polar radius by
    about 21 km
  - >-
    Witold Fraczek (Esri), If the Earth Stood Still: modeling the absence of centrifugal force, ArcUser (2010):
    oceans migrate to the poles, leaving an equatorial mega-continent
  - >-
    Glatzmaier & Roberts, A three-dimensional self-consistent computer simulation of a geomagnetic field reversal,
    Nature 377 (1995): rotation organises the core dynamo
  - >-
    Vsauce, What If the Earth Stopped Spinning (2014), for the instant-stop case and the one-year day
  facts:
  - >-
    At the equator the ground moves east at about sixteen hundred kilometres an hour; at the poles it does not move
    at all.
  - >-
    The spin bulges the planet by about twenty-one kilometres at the equator; without it the oceans drain toward
    the poles.
  - 'With no rotation, one solar day equals one orbit: six months of light, six months of dark.'
  - >-
    The magnetic field comes from convection in the liquid iron outer core organised by the Earth's rotation; a
    non-rotating core loses that organisation.
  - >-
    Jet streams and trade winds exist because of the Coriolis effect, which vanishes with the spin.
  era_sheet:
    timeline: the present day, over one year
    architecture: >-
      real places: a Kansas wheat farm, a Foucault pendulum in a science museum, a Singapore quay, the Siberian
      coast, a mountain town at the terminator
    clothing: ordinary present-day clothes, parkas in the night zone, sun hoods in the day zone
    vehicles: >-
      airliners rerouting, a harbour ferry stranded by a falling tide, lorries in convoy toward the dusk line
    street: >-
      a brass Foucault pendulum over floor markers, a sundial, a tide gauge, cracked mud, frost on the far side
    light: >-
      a sun that hangs too long: long noons, long dusks; six-month night lit by stars and headlamps
    palette: wheat gold, cold cyan sky, brass, frost grey, deep cyan accent
    forbidden: people flung through the air, exploding buildings, glowing effects, text, cartoon physics
  cost: >-
    The spin did one more job: it organised the churning iron of the outer core into the magnetic field that deflects
    the solar wind. Without rotation the field decays, and the solar wind begins to strip the upper atmosphere,
    slowly, the way it did to Mars.
beats:
- id: hook
  vo: >-
    What if the Earth stopped spinning. Not all at once, that would kill everyone by lunch. Slowly, over one year.
    Day one feels normal. Day three hundred lasts a week.
  card:
    text: WHAT IF THE EARTH STOPPED SPINNING
    style: title
- id: hinge
  vo: >-
    The ground at the equator moves at one thousand seven hundred kilometres an hour. Here it slows, a little each
    day, until a year from now it stops. This is how it happens.
  card:
    text: TONIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Month three. Days are thirty-two hours long, so afternoons bake and nights freeze harder every week. Crops
    bolt. Flights reroute, because the winds have changed.
  card:
    text: MONTH THREE
    style: phase
- id: phase2
  vo: >-
    Month nine. The spin made the planet twenty-one kilometres wider at the equator, and the sea sat on that bulge. As it fades the water runs to the poles, so Canada drowns and the equator rises as one dry continent.
  card:
    text: MONTH NINE
    style: phase
- id: phase3
  vo: >-
    Year one. The Earth stands still. A day now lasts a year: six months of sun, six months of night. Eight billion people live on the dusk line, and move with it.
  card:
    text: YEAR ONE
    style: phase
- id: turn
  vo: >-
    [exhale] But the spin did one more job. It stirred the liquid iron that makes the magnetic field. Without it the field fades over thousands of years, and the solar wind starts stripping the air.
  card: null
- id: dilemma
  vo: 'That timeline never happened. Ours did. So: the day side, or the night side?'
  card:
    text: The day side, or the night side?
    style: question
