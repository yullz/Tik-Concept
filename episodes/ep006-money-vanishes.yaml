dilemma: Your debts erased, your savings too. Do you take that night?
pinned_comment: >-
  I take it. Most people on Earth owe more than they own; a wiped ledger is the biggest jubilee in history and the
  people who lose are the ones with numbers to lose. The bakery was taking eggs by breakfast. We'd be fine.
metadata:
  cover_time: 0.6
  second_comment: >-
    No. Savings are a pensioner's biscuit tin and a hospital's budget, not a billionaire's spreadsheet. Erase the
    numbers and the first people to go hungry are the ones with nothing to barter.
