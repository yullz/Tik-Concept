research:
  hinge: >-
    At midnight every form of money, cash, bank balances and crypto, is deleted, and every debt with it. Goods,
    buildings and skills remain. What follows is what economists have observed every time money failed: it is reinvented
    within hours, because money is a record of who owes what to whom.
  hinge_date: midnight
  sources:
  - Kocherlakota, Money is Memory, Journal of Economic Theory 81 (1998)
  - >-
    R. A. Radford, The Economic Organisation of a P.O.W. Camp, Economica 12 (1945): cigarettes as currency
  - >-
    Antoin Murphy, Money in an Economy Without Banks: the Case of Ireland, The Manchester School 46 (1978): the
    1970 bank closure, about six months, with cheques and pubs as the clearing system
  - 'W. S. Jevons, Money and the Mechanism of Exchange (1875): the double coincidence of wants'
  - >-
    Jack & Suri, Mobile Money: The Economics of M-PESA (NBER, 2011): phone credit as money in Kenya
  - 'Felix Martin, Money: The Unauthorised Biography (2013)'
  facts:
  - >-
    Barter fails because both sides must want what the other has at the same moment; a tab solves that, and a tab
    is money.
  - Allied prisoners of war ran a working economy on cigarettes in the nineteen forties.
  - >-
    Ireland's banks closed for about six months in nineteen seventy; people paid with endorsed cheques and pubs
    acted as banks.
  - >-
    Kenya's M-PESA turned phone credit into everyday money for tens of millions within a few years of 2007.
  - >-
    Germany's Rentenmark of nineteen twenty-three replaced a worthless currency overnight and held, because people
    decided to trust it.
  - >-
    Pensions, insurance and hospital budgets are numbers; a wiped ledger hits those who hold nothing physical hardest.
  era_sheet:
    timeline: >-
      the present day: day one, week one, year one; two historical inserts (a 1940s camp table, a 1970 Dublin pub)
    architecture: >-
      a corner shop, a street market, a Dublin pub with a long bar, a central bank printing hall, a pensioner's
      flat
    clothing: >-
      present-day ordinary clothes; 1970 Dublin coats and caps; 1940s wool uniforms at a camp table
    vehicles: a bicycle traded on a doorstep, a bread van
    street: >-
      a spiral notebook ledger, an empty cash drawer, eggs, a jar of honey, cigarettes on a wooden table, endorsed
      cheques, phones held up to each other, fresh notes on a press
    light: >-
      soft shop morning, warm pub lamps, market noon, printing-hall fluorescent, a pensioner's kitchen at dusk
    palette: paper cream, notebook blue, egg brown, deep cyan accent
    forbidden: piles of gold, burning banknotes, riots, text on notes or screens, crypto logos
  cost: >-
    A clean slate has a price. Pensions were numbers, hospitals ran on numbers, and the people with nothing physical
    to trade were the ones who needed the numbers most.
beats:
- id: hook
  vo: >-
    What if money vanished at midnight. Every coin, every account, every bitcoin, gone. Your debts too. By breakfast
    the bakery is taking eggs.
  card:
    text: WHAT IF MONEY VANISHED AT MIDNIGHT
    style: title
- id: hinge
  vo: >-
    Money is a memory: a record of who owes what to whom, kept on clay tablets five thousand years ago. Here the
    record is wiped clean, savings and debts alike. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day one. Nothing is for sale, because nobody can make change. By noon the corner shop runs a tab. By dusk the
    notebook is money. It took nine hours to invent it again.
  card:
    text: DAY ONE
    style: phase
- id: phase2
  vo: >-
    Week one. Prisoners of war once used cigarettes. Ireland in nineteen seventy used pub cheques for six months
    when the banks closed. Here the new money is phone credit, because everyone has it and the network keeps the
    count.
  card:
    text: WEEK ONE
    style: phase
- id: phase3
  vo: >-
    Year one. The state prints again and it works, because money only ever ran on trust. But the old ledger is gone.
    Land, tools and skills kept their value. Numbers did not.
  card:
    text: YEAR ONE
    style: phase
- id: turn
  vo: >-
    [exhale] But a clean slate has a price. Pensions were numbers. Hospitals ran on numbers. The people with nothing
    to barter were the ones who needed the numbers most.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: your debts erased, your savings too. Do you take that night?
  card:
    text: Your debts erased, your savings too. Do you take that night?
    style: question
