research:
  hinge: >-
    At midnight every data network on Earth, cables, satellites and mobile data, stops carrying traffic, and stays
    down for twelve months. Phones still ring on voice-only circuits; nothing else connects.
  hinge_date: tonight, for twelve months
  sources:
  - 'ITU, Facts and Figures 2024: about 5.5 billion people online'
  - >-
    Microsoft, Helping our customers through the CrowdStrike outage (July 2024): about 8.5 million devices affected;
    airlines, hospitals and banks disrupted for days
  - >-
    Tonga's January 2022 volcanic eruption cut its only submarine cable; the country was largely offline for about
    five weeks (Reuters, February 2022)
  - Egypt's January 2011 five-day internet shutdown (Renesys/Dyn analysis)
  - 'SWIFT, FIN traffic figures: around 45-50 million messages a day (2023)'
  - >-
    Deloitte, The economic impact of disruptions to Internet connectivity (2016): a highly connected country loses
    about 1.9 percent of daily GDP per day of shutdown
  facts:
  - >-
    About five and a half billion people use the internet; most card payments, bank transfers and ATM networks run
    over it.
  - >-
    A single faulty software update in July 2024 grounded flights and closed hospital systems for days on about
    eight and a half million machines.
  - >-
    Tonga lived without its cable for about five weeks in 2022; Egypt switched off for five days in 2011. Both recovered;
    neither was a year.
  - >-
    Container shipping, customs clearance and just-in-time factory supply all run on connected systems.
  - >-
    Economists estimate shutdown costs at a couple of percent of GDP per day for connected economies; a year is
    far beyond anything measured, so the fifth-of-the-economy figure is this episode's own estimate, labelled as
    such.
  era_sheet:
    timeline: 'the present day: day one, week two, month six'
    architecture: >-
      real places: a bakery with a card terminal, a container port, a newsroom, a town hall, a rural post office
    clothing: present-day ordinary clothes
    vehicles: stacked containers, idle cranes, buses with paper timetables, a mail van
    street: >-
      dark screens, handwritten signs, cash boxes, paper ledgers, a fax machine, a radio on a counter, a queue
    light: fluorescent shop light, grey port morning, warm radio-lit kitchens at night
    palette: dark screen black, paper white, sodium amber, deep cyan accent
    forbidden: hackers, glowing code, riots as spectacle, text on screens, apocalypse clichés
  cost: >-
    The quiet costs have no headline: the cyclone warning that never arrives, the recalled medicine nobody hears
    about, the lab result that sits on a server. A year offline is a year without the warnings.
beats:
- id: hook
  vo: >-
    What if the internet went dark tonight. Every cable, every satellite, every tower. Twelve months. The card machine
    at the bakery just said no.
  card:
    text: WHAT IF THE INTERNET WENT DARK FOR A YEAR
    style: title
- id: hinge
  vo: >-
    Six billion people are online tonight. At midnight the networks stop, all of them, and they stay
    stopped for a year. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day one. Cards die first, so cash is king by breakfast and gone by lunch, because the cash machines were online
    too. Some planes fly, on radio and paper, but nobody can book one.
  card:
    text: DAY ONE
    style: phase
- id: phase2
  vo: >-
    Week two. Ships arrive at ports that cannot read their cargo, so containers stack up and shelves empty. Factories
    that ordered parts by the hour stop by the day. Paper comes back, and so does the queue.
  card:
    text: WEEK TWO
    style: phase
- id: phase3
  vo: >-
    Month six. Radio is the news again. The fax machine is a job. Towns print money on card, because the bank is
    a building you can see. The economy, by one estimate, shrinks by a fifth.
  card:
    text: MONTH SIX
    style: phase
- id: turn
  vo: >-
    [exhale] But the quiet costs come without a headline. The cyclone warning that never arrives. The recalled medicine
    nobody hears about. A year offline is a year without the warnings.
  card: null
- id: dilemma
  vo: 'That timeline never happened. Ours did. So who suffers more: the city, or the village?'
  card:
    text: 'Who suffers more: the city, or the village?'
    style: question
