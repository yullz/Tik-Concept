dilemma: 'Who suffers more: the city, or the village?'
pinned_comment: >-
  The city. Cities are machines that run on connection: food arrives by the hour, money is a number, and nobody
  knows their neighbour. A village has a shop with a tab and a man with a radio. Change my mind.
metadata:
  cover_time: 0.6
  second_comment: >-
    The village. The city has the hospital, the warehouse and the mayor; the village has a pharmacy that gets its
    orders from a server in the city. When the warnings stop, the far end of the line hears last.
