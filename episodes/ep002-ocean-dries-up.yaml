dilemma: Do you climb to the rain, or walk down to the salt?
pinned_comment: >-
  Down. The seabed is three kilometres closer to the groundwater, the old ports are already there, and the cliff
  towns will be fighting over rain by week two. Change my mind.
metadata:
  cover_time: 0.9
  second_comment: >-
    Up, every time. Seventy degrees on the trench floor and sixty on the plains by year ten. The rain that is left
    falls on mountains. Whoever holds the high ground holds the water.
