look_key_prompt: >-
  empty establishing frame of a dry ocean basin at dawn, a cracked white salt plain to the horizon, a grey sediment
  cliff several kilometres high in the far distance with a city on its lip, cold low sun, haze
research:
  hinge: >-
    At midnight every drop of seawater, about one point three billion cubic kilometres, vanishes; the salt, the
    seabed and the atmosphere stay. Everything after follows from measured physics: depth, lapse rate, the water
    cycle and the ocean's heat capacity.
  hinge_date: tonight
  sources:
  - NOAA, How much water is in the ocean (1.335 billion km³; mean depth about 3,682 m)
  - NOAA Ocean Exploration, Challenger Deep depth (about 10,935 m)
  - >-
    USGS Water Science School, The water cycle: oceans supply about 86 percent of global evaporation; fresh water
    is about 2.5 percent of all water
  - >-
    IPCC AR6 WG1 (2021): the ocean has taken up more than 90 percent of the excess heat in the climate system
  - Randall Munroe, What If? (2014), Drain the Oceans
  facts:
  - >-
    Mean ocean depth is about three thousand seven hundred metres, so the coast becomes a cliff of that height.
  - >-
    Air warms by roughly six and a half degrees for every kilometre you descend, so a trench floor eleven kilometres
    down runs around seventy degrees in the tropics.
  - >-
    The atmosphere holds about ten days of rain; most evaporation comes from the sea, so rain stops within weeks.
  - >-
    Fresh water is two and a half percent of the total, most of it ice; the Great Lakes and Lake Baikal each hold
    about a fifth of the liquid fresh water on the surface.
  - >-
    The ocean has absorbed over ninety percent of the heat humans added to the climate; without it, land temperatures
    swing wildly between day and night.
  era_sheet:
    timeline: the present day, the morning after
    architecture: >-
      real ports: Rotterdam cranes, Singapore container terminals, Hong Kong towers now on a cliff edge
    clothing: >-
      ordinary present-day work clothes, hi-vis vests, dust masks, keffiyeh-style scarves against salt dust
    vehicles: >-
      container ships on their sides or upright on sediment, tugboats, pickup trucks on salt, no flying anything
    street: >-
      harbour tide gauges, bollards, rusted anchor chains, cracked salt crust, dry kelp, bleached coral
    light: >-
      dawn and brutal noon over white salt; night with frost; cyan accent in rationed water, tarps, hull paint
    palette: salt white, sediment grey, hull rust, deep cyan accent
    forbidden: sea monsters, glowing anything, fantasy skies, floating objects, text on signs
  cost: >-
    The ocean was never just water. It is the planet's thermostat: it absorbed more than ninety percent of the heat
    we added, it made most of the rain, and it kept day and night within a few degrees of each other. Without it
    the Earth behaves like a desert planet.
beats:
- id: hook
  vo: >-
    What if the ocean dried up tonight. Every drop, gone at midnight. By sunrise, the Titanic is standing on dry
    land.
  card:
    text: WHAT IF THE OCEAN DRIED UP TONIGHT
    style: title
- id: hinge
  vo: >-
    The water goes. The salt stays. One point three billion cubic kilometres of sea, gone. Every coastline becomes
    a cliff nearly four kilometres high. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day one. Every port is a cliff top. Ships lie on a salt plain three continents wide. The seabed is the lowest
    land there is, so its air is thick and hot. The trench floor reads seventy degrees.
  card:
    text: DAY ONE
    style: phase
- id: phase2
  vo: >-
    Week two. The ocean made most of the world's rain, so the rain stops. Rivers run off the cliff and vanish into
    salt. Salt storms cross whole countries. Harvests fail from India to Iowa.
  card:
    text: WEEK TWO
    style: phase
- id: phase3
  vo: >-
    Year ten. The water left, two and a half percent, sits in lakes and ice, so eight billion people crowd the Great
    Lakes and Baikal. By day the salt plains hit sixty degrees. By night they freeze.
  card:
    text: YEAR TEN
    style: phase
- id: turn
  vo: >-
    [exhale] But the ocean was never just water. It held ninety percent of the heat we added. Without it, the planet
    swings between furnace and freezer. The ocean was the thermostat.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. Tonight: do you climb to the rain, or walk down to the salt?
  card:
    text: Do you climb to the rain, or walk down to the salt?
    style: question
