research:
  hinge: >-
    Horses evolved in North America and died out there at the end of the last Ice Age, about ten thousand years
    ago, returning only with the Spanish in the 1490s and 1510s. In this timeline a few plains herds survive the
    thaw, and the peoples of the Americas domesticate them thousands of years before contact.
  hinge_date: about 10,000 years ago
  sources:
  - >-
    Haile et al., Ancient DNA reveals late survival of mammoth and horse in interior Alaska, PNAS 106 (2009)
  - Bruce MacFadden, Fossil Horses (1992), on the origin of Equus in North America
  - >-
    Outram et al., The earliest horse harnessing and milking, Science 323 (2009): Botai domestication around 3500
    BC
  - >-
    Pekka Hämäläinen, The Comanche Empire (2008): a horse empire built within a century of acquiring horses
  - 'Timothy Pauketat, Cahokia: Ancient America''s Great City on the Mississippi (2009)'
  - >-
    Bernal Díaz del Castillo, The True History of the Conquest of New Spain, on the sixteen horses of 1519
  facts:
  - >-
    The horse family evolved in North America over fifty million years and spread to Asia across the Bering land
    bridge.
  - >-
    Horses vanished from the Americas around ten thousand years ago with the other large Ice Age animals.
  - On the Eurasian steppe, horses were domesticated by about three thousand five hundred BC.
  - >-
    The Comanche went from first horses to a plains empire in roughly a hundred years; Cahokia, around the year
    eleven hundred, held perhaps fifteen to twenty thousand people.
  - >-
    Cortés landed in 1519 with sixteen horses; Mesoamerica had wheeled toys but no draught animals.
  era_sheet:
    timeline: >-
      the end of the Ice Age; five thousand years ago on the Missouri; Cahokia around the year one thousand; the
      beach at Veracruz in 1519
    architecture: >-
      none at first; later earthen platform mounds, thatched wattle-and-daub houses, log palisades, stone-and-timber
      relay posts
    clothing: >-
      hide and fur at the thaw; woven and hide clothing with shell and copper ornaments by the year one thousand;
      riders in hardened leather armour with copper plates; Spanish in steel morions and brigandines in 1519
    vehicles: >-
      small stocky horses, rawhide bridles with a copper bead, timber corrals, two-wheeled carts by the year one
      thousand, Spanish ships' boats
    street: tall grass, bison, river bluffs, earth mounds, corrals, a Veracruz beach with dunes
    light: Ice Age dawn, hard plains noon, torch-lit night raid, Gulf coast morning
    palette: grass gold, river brown, copper, crimson accent in paint and bead
    forbidden: >-
      nineteenth-century war bonnets and tipis in the year one thousand, Hollywood western framing, tribal caricature,
      text, modern flags
  cost: >-
    The horse brings the steppe with it. Wherever riders meet farmers, the riders win for a thousand years and burn
    the cities: Cahokia falls twice before Columbus. An empire on horseback is still an empire, with everything
    that word carries.
beats:
- id: hook
  vo: >-
    What if horses never left America. Born here, gone ten thousand years ago. Here they stay, and the first cavalry
    on Earth is American.
  card:
    text: WHAT IF HORSES NEVER LEFT AMERICA
    style: title
- id: hinge
  vo: >-
    The horse evolved in North America, died out at the end of the Ice Age, and only returned with the Spanish.
    Here, a few herds survive the thaw. This is how it happens.
  card:
    text: 10,000 YEARS AGO · THE HINGE
    style: date
- id: phase1
  vo: >-
    Year five thousand. Someone on the Missouri climbs on and rides. A rider moves five times faster than a walker,
    so the plains become a road. Bison are herded, not hunted.
  card:
    text: 3000 BC
    style: phase
- id: phase2
  vo: >-
    Year one thousand. Cahokia, on the Mississippi, has cavalry. Nomads raid it as the steppe raided China, so it
    builds walls and relays. The wheel arrives, because something can pull it.
  card:
    text: 1000 AD
    style: phase
- id: phase3
  vo: >-
    Fifteen nineteen. Cortés lands with sixteen horses and meets ten thousand. The invasion ends on the beach, because
    an empire that rides cannot be surprised. Europe trades. It does not conquer.
  card:
    text: '1519'
    style: phase
- id: turn
  vo: >-
    [exhale] But the horse brings the steppe. Wherever riders meet farmers, riders win for a thousand years and
    burn the cities. Cahokia falls twice before Columbus. An empire on horseback is still an empire.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. Cavalry on the beach: does the invasion end, or do the horses just change
    who conquers?
  card:
    text: 'Cavalry on the beach: does the invasion end, or just change who conquers?'
    style: question
