dilemma: >-
  Cavalry on the beach: does the invasion end there, or do the horses just change who conquers?
pinned_comment: >-
  It ends there. The conquest ran on horses, steel and surprise, and this timeline takes two of the three off the
  table on the first morning. Europe sells cannon and buys silver. Nobody gets an empire for free.
metadata:
  cover_time: 0.6
  second_comment: >-
    It just changes who conquers. The Comanche built an empire in a century with horses alone. Give the plains five
    thousand years of cavalry and the Spanish meet an empire that has already done the conquering.
