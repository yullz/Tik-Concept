look_key_prompt: >-
  empty establishing frame of a living room at midnight lit by one candle, a smartphone's glass and metal parts
  lying loose on a side table, a wool coat on a chair, the lamp dark, cold cyan moonlight through the window
research:
  hinge: >-
    At midnight every gram of synthetic polymer on Earth disappears: packaging, fibres, insulation, casings, tubing,
    paint binders. Metal, glass, wood, wool, cotton and paper remain, which is exactly what the world was made of
    before 1950.
  hinge_date: midnight
  sources:
  - >-
    Geyer, Jambeck & Law, Production, use, and fate of all plastics ever made, Science Advances 3 (2017): about
    8.3 billion tonnes produced since 1950
  - >-
    Textile Exchange, Materials Market Report (2023): polyester alone is over half of global fibre production; synthetics
    about two thirds
  - >-
    IEC/IEEE cable standards: nearly all building wiring and underground power cable is insulated with PVC or cross-linked
    polyethylene
  - >-
    WHO, Medical devices: single-use plastics (syringes, IV sets, blood bags, gloves, catheters) are the standard
    of care worldwide
  - >-
    FAO, Global food losses and food waste (2011), on the role of packaging in reducing spoilage
  facts:
  - >-
    More than eight billion tonnes of plastic have been made since nineteen fifty, and most of it still exists.
  - >-
    About six in ten garments contain synthetic fibre; a world without polymer is a world half undressed.
  - >-
    House wiring, underground cables and car looms are insulated with plastic; without it they short at once, so
    the grid and most vehicles fail.
  - >-
    Syringes, drip sets, blood bags, gloves and tubing are plastic; medicine without them is medicine of the nineteen
    thirties, in glass and steel.
  - 'Food packaging is a preservative: without it fresh food spoils in days.'
  - >-
    The ocean's plastic load, estimated in the hundreds of millions of tonnes, vanishes with everything else.
  era_sheet:
    timeline: 'the present day: minute one, week one, year ten'
    architecture: >-
      a living room, a city street, a hospital ward and operating theatre, a supermarket, a harbour, a rebuilt kitchen
      in glass and tin
    clothing: >-
      wool, cotton, linen and leather only; at minute one, many people half dressed under blankets
    vehicles: >-
      cars stopped with hoods open, a tram with bare copper wiring, bicycles with leather saddles
    street: >-
      loose phone components, bare copper wires, a drip stand with a glass bottle, a steel syringe, glass milk bottles,
      paper bags, tin cans
    light: candle and moonlight at minute one, hospital daylight, a clean bright harbour in year ten
    palette: glass green, copper, wool grey, paper cream, deep cyan accent
    forbidden: naked bodies, melting effects, glowing, text on packaging, cartoon chaos
  cost: >-
    Plastic was never the villain; it was the cheapest clean thing we ever made. The bottles were the problem. The
    blood bags were the point.
beats:
- id: hook
  vo: >-
    What if plastic vanished tonight. All of it. Your phone falls apart. Your shirt is gone. The lights go out,
    because every wire was wrapped in it.
  card:
    text: WHAT IF PLASTIC VANISHED TONIGHT
    style: title
- id: hinge
  vo: >-
    Humans have made more than eight billion tonnes of plastic since nineteen fifty, and it is in everything. Here,
    at midnight, every gram of it disappears. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Minute one. Six in ten garments on Earth are synthetic, so most people are half dressed. Cars stop, because
    their wiring shorts. The grid fails for the same reason. Pipes split.
  card:
    text: MINUTE ONE
    style: phase
- id: phase2
  vo: >-
    Week one. The hospitals are the real loss. Drips, syringes, blood bags, gloves, all plastic. Surgery goes back
    to glass and steel, slower and deadlier. Food spoils in days, because packaging was the preservative.
  card:
    text: WEEK ONE
    style: phase
- id: phase3
  vo: >-
    Year ten. The world is rebuilt in glass, tin, wool and paper. The sea is clear, because nothing new goes in.
    Every hospital has a wing for the people who would have lived.
  card:
    text: YEAR TEN
    style: phase
- id: turn
  vo: >-
    [exhale] But plastic was never the villain. It was the cheapest clean thing we made. The bottles were the problem.
    The blood bags were the point.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: the clear sea, or the full hospital. Which one do you keep?
  card:
    text: The clear sea, or the full hospital. Which one do you keep?
    style: question
