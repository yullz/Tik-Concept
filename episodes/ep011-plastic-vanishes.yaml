dilemma: The clear sea, or the full hospital. Which one do you keep?
pinned_comment: >-
  The hospital. A clean ocean is a beautiful thing, and a child on a drip is a more beautiful thing. We can fix
  the bottles with rules. We cannot fix a blood bag with glass.
metadata:
  cover_time: 0.6
  second_comment: >-
    The sea. Medicine ran on glass and steel until the nineteen sixties and people lived; the ocean has never once
    recovered from what we put in it. One is a cost we can pay. The other we have never managed to pay back.
  hashtags:
  - '#whatif'
  - '#plastic'
  - '#science'
  - '#environment'
  - '#tomorrowmorning'
  replies_to_prepare:
  - Natural rubber and bakelite aren't plastic, they'd stay
  - We'd just use glass for everything, it's fine
