research:
  hinge: >-
    All of Earth's land ice, about twenty-six million cubic kilometres, mostly on Antarctica, melts over seven days.
    Sea level rises roughly seventy metres; everything below that line, including most of the world's great ports
    and deltas, is under water.
  hinge_date: this week
  sources:
  - >-
    National Geographic, What the World Would Look Like If All the Ice Melted (September 2013): about 216 feet (66
    m) of sea-level rise and the resulting continental maps
  - 'USGS, How would sea level change if all glaciers melted: about 70 metres'
  - >-
    Fretwell et al., Bedmap2: ice thickness and subglacial topographic model of Antarctica, The Cryosphere 7 (2013):
    about 26.5 million km³ of ice; much of West Antarctica's bedrock below sea level
  - >-
    Kulp & Strauss, New elevation data triple estimates of global vulnerability to sea-level rise, Nature Communications
    10 (2019): about one billion people live below 10 m
  - IPCC AR6 WG1 (2021) on meltwater weakening the Atlantic overturning circulation
  facts:
  - >-
    Antarctica holds about twenty-six million cubic kilometres of ice; Greenland about three million; mountain glaciers
    add a little.
  - >-
    Melting all of it raises the sea by about seventy metres; Shanghai, Dhaka, Miami, Amsterdam and most of Bangladesh
    and the Netherlands lie below that line.
  - Roughly a billion people live within ten metres of sea level today.
  - A flood of fresh meltwater weakens the Atlantic current that keeps north-west Europe mild.
  - >-
    On the 70-metre map the Amazon basin and the Mississippi valley become inland seas; Antarctica's East is high
    bare rock.
  - >-
    The great river deltas, the Nile, the Ganges, the Mekong, feed hundreds of millions and are among the first
    to go under.
  era_sheet:
    timeline: 'the present day: day seven, month one, year ten'
    architecture: >-
      real skylines partly submerged: Shanghai, Miami, Amsterdam, Dhaka; inland cities improvising harbours; tent
      cities on hills; a bare-rock Antarctic shore
    clothing: present-day clothes, life jackets, waders, parkas in the south
    vehicles: >-
      container ships anchored off drowned ports, small boats between towers, buses as ferries, helicopters
    street: >-
      tide marks on towers, salt-crusted fields, a drowned airport, pallets of rice, a survey flag on bare rock
    light: grey dawn over water, hard sun on salt flats, long polar summer light in Antarctica
    palette: sea grey, concrete, salt white, deep cyan accent
    forbidden: tidal-wave spectacle, bodies, glowing effects, text, cartoon flooding
  cost: >-
    The water is not the worst of it. The deltas that feed a billion people, the Nile, the Ganges, the Mekong, are
    under salt; the famine outlasts the flood.
beats:
- id: hook
  vo: >-
    What if all the ice melted this week. Every glacier, both ice caps, gone by Sunday. The sea rises seventy metres.
    London is a reef.
  card:
    text: WHAT IF ALL THE ICE MELTED THIS WEEK
    style: title
- id: hinge
  vo: >-
    There are twenty-six million cubic kilometres of ice on Earth, nearly all on Antarctica. Here it goes in seven
    days, and the sea climbs seventy metres. This is how it happens.
  card:
    text: THIS WEEK · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day seven. The water reaches seventy metres above the old tide, so Shanghai, Dhaka, Miami and most of the Netherlands
    are gone. A tenth of humanity lived below ten metres. They moved uphill, or did not.
  card:
    text: DAY SEVEN
    style: phase
- id: phase2
  vo: >-
    Month one. The ports are under water, so the ships have nowhere to unload. Trade stops. A billion people live
    inland, uninvited. Meltwater stalls the current that warms Europe, so Paris gets Canada's winter.
  card:
    text: MONTH ONE
    style: phase
- id: phase3
  vo: >-
    Year ten. The map is new. The Amazon basin is a sea. Antarctica, bare rock for the first time in thirty million
    years, is the last unclaimed land on Earth.
  card:
    text: YEAR TEN
    style: phase
- id: turn
  vo: >-
    [exhale] But the water is not the worst of it. The deltas that feed a billion people, the Nile, the Ganges,
    the Mekong, are salt now. The famine lasts longer than the flood.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: uphill with everyone else, or south to the new continent?
  card:
    text: Uphill with everyone else, or south to the new continent?
    style: question
