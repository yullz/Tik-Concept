dilemma: Uphill with everyone else, or south to the new continent?
pinned_comment: >-
  South. A continent the size of Europe and America together, no owners, no borders, and the only fresh ice left
  on Earth. Antarctica in this timeline is the only place that is not already full.
metadata:
  cover_time: 0.9
  second_comment: >-
    Uphill. Antarctica is bare rock with six months of night and no soil; moss takes centuries. You cannot farm
    a continent that has never had a worm in it. Go where the dirt is.
