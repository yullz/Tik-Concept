look_key_prompt: >-
  empty establishing frame of a suspension bridge at night, lit, with cars stopped mid-span and their headlights
  on, no people anywhere, mist on the river, cold cyan light
research:
  hinge: >-
    At midnight every human being vanishes at once. Nothing else changes: the lights are on, the pumps are running,
    the animals are asleep. From that moment nothing is maintained, and the world begins to take the cities back
    on a timetable that engineers and ecologists can actually estimate.
  hinge_date: midnight
  sources:
  - >-
    Alan Weisman, The World Without Us (2007): New York's subway pumps and the two-day flooding estimate, roads,
    bridges, and what endures
  - >-
    Deryabina et al., Long-term census data reveal abundant wildlife populations at Chernobyl, Current Biology 25
    (2015)
  - >-
    Geyer, Jambeck & Law, Production, use, and fate of all plastics ever made, Science Advances 3 (2017)
  - NASA JPL, Voyager Golden Record (1977) mission pages
  - History Channel, Life After People (2008) and the engineering interviews it drew on
  facts:
  - >-
    New York's subway relies on pumps removing millions of gallons of water a day; without power they stop and the
    tunnels flood within about two days.
  - >-
    Thermal power plants trip without operators and fuel deliveries within hours; the grid fails in a cascade.
  - >-
    Dogs survive by size and breed; small lap dogs mostly do not; feral packs form within a year.
  - >-
    The Chernobyl exclusion zone, abandoned in 1986, now holds thriving wolf, boar and elk populations.
  - >-
    Steel bridges rust through in about a century without paint and inspection; frost heave breaks roads in a few
    winters.
  - >-
    Plastics persist for centuries; the Giza pyramids have lasted four and a half thousand years; the two Voyager
    probes carry gold records and will drift for billions of years.
  era_sheet:
    timeline: 'the present day: day two, year one, year one hundred'
    architecture: >-
      a suspension bridge over a river (the through-line), a suburban street, a subway entrance, a power-plant control
      room, a shopping street, a museum with a city model
    clothing: none; no humans after midnight
    vehicles: cars stopped with headlights on, a bus on a bridge, then wrecks under vines
    street: >-
      steaming coffee cup, a wristwatch on the pavement, a dog at a door, turnstiles, cracked asphalt with dandelions,
      rusted cables, moss on a city model, a plastic bottle in sand
    light: >-
      sodium street light at night, grey dawn, smoke-orange fires, green forest light, dusk over a fallen bridge
    palette: sodium amber, concrete grey, vine green, rust, deep cyan accent
    forbidden: bodies, zombies, explosions, Hollywood ruins with skulls, text, people
  cost: >-
    Some things do not go. Plastic lasts centuries, the pyramids a hundred thousand years at least, and two probes keep falling
    away from the sun carrying a gold record of our voices, to nobody.
beats:
- id: hook
  vo: >-
    What if every human vanished tonight. Eight billion people, gone at midnight. The lights stay on for hours.
    Then the planet starts taking the cities back.
  card:
    text: WHAT IF EVERY HUMAN VANISHED TONIGHT
    style: title
- id: hinge
  vo: >-
    No war, no plague, just absence: eight billion of us gone at once. Everything we built is still here, and nothing
    is maintaining it. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day two. The power plants trip without anyone to feed them. The pumps stop, so the subways of New York flood
    within forty-eight hours. Dogs leave the houses. The small ones do not last.
  card:
    text: DAY TWO
    style: phase
- id: phase2
  vo: >-
    Year one. Lightning starts fires nobody puts out, so suburbs burn and ash feeds the weeds. Cattle go feral or
    get eaten. Roads crack, because frost does its work and nobody fills the hole.
  card:
    text: YEAR ONE
    style: phase
- id: phase3
  vo: >-
    Year one hundred. Chernobyl already showed us: wolves and forest within decades. Rivers take their old beds
    back. Bridge cables rust bare. The cities are green hills with towers in them.
  card:
    text: YEAR ONE HUNDRED
    style: phase
- id: turn
  vo: >-
    [exhale] But some things do not go. Plastic lasts centuries. The pyramids, a hundred thousand years at least. And two probes
    keep falling away from the sun carrying a gold record of our voices, to nobody.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: the last human thing standing: the pyramid, the plastic, or the
    probe?
  card:
    text: 'The last human thing standing: the pyramid, the plastic, or the probe?'
    style: question
