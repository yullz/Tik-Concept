dilemma: 'The last human thing standing: the pyramid, the plastic, or the probe?'
pinned_comment: >-
  The probe. The pyramids wear down over a hundred thousand years or so, plastic in a few thousand, but Voyager is in interstellar space with nothing to touch it. In a billion years the only proof we existed is a gold record.
metadata:
  cover_time: 0.6
  second_comment: >-
    The plastic. Not a bottle, the layer: a thin band of polymer in the rock of every continent, the way the asteroid that ended the dinosaurs left an iridium line. The pyramids are a monument. The plastic is a fossil.
  hashtags:
  - '#whatif'
  - '#science'
  - '#nature'
  - '#earth'
  - '#tomorrowmorning'
  replies_to_prepare:
  - Nuclear plants would melt down and poison everything
  - Dogs would be fine, they're wolves
