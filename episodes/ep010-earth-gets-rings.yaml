dilemma: "The most beautiful sky in the solar system, and no way out. Do you take it?"
pinned_comment: >-
  I take it. We have had satellites for seventy years and the sky for three hundred thousand. Nights bright enough
  to read by, winters with a shadow across the sun, and a ring that every child on Earth grows up under. Yes.
metadata:
  cover_time: 0.8
  second_comment: >-
    No. A ring is a cage with good lighting. No weather satellites means no storm warnings; no GPS means ships back
    on sextants; and no one ever leaves. Beauty is not worth a locked door.
  hashtags: ["#whatif", "#space", "#science", "#earth", "#tomorrowmorning"]
  replies_to_prepare:
    - "Rings would fall as meteors and kill everyone"
    - "Earth had a ring 466 million years ago, this is real"
