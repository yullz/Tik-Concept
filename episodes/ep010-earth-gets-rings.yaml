research:
  hinge: >-
    A small moon strays inside Earth's Roche limit and breaks apart; its debris spreads into a thin flat ring of rock from a thousand to ten thousand kilometres up, across the zone where satellites orbit. In this timeline that
    happens tonight.
  hinge_date: "tonight"
  sources:
    - "NASA/JPL Cassini mission pages: Saturn's rings are mostly water ice, a few tens of metres thick and hundreds of thousands of kilometres wide"
    - "Roy Prol, What Earth Would Look Like With Rings (2009 visualisation), on ring shadows by latitude and season"
    - "Kessler & Cour-Palais, Collision frequency of artificial satellites: the creation of a debris belt, JGR 83 (1978)"
    - "Canup, Origin of Saturn's rings and inner moons by mass removal from a lost Titan-sized satellite, Nature 468 (2010), on how rings form from a disrupted moon"
    - "Longcore & Rich, Ecological light pollution, Frontiers in Ecology and the Environment 2 (2004), on what bright nights do to animals"
  facts:
    - "Rings sit inside the Roche limit, within a few Earth radii; for Earth that is the region where satellites fly."
    - "A ring reflects sunlight all night; seen from the ground it would outshine the full Moon many times over except where Earth's own shadow falls across it."
    - "From the equator a ring is seen edge-on as a thin line; from mid-latitudes it is a broad band arching across the sky."
    - "In winter the ring's shadow falls across the hemisphere tilted away from the Sun, cooling and darkening mid-latitude winters."
    - "Nocturnal animals, from moths to sea turtles, navigate and feed by darkness; permanent bright nights disrupt them."
    - "Any launch has to cross the ring plane; a collision at orbital speed destroys the vehicle, so the ring closes the sky."
  era_sheet:
    timeline: "the present day: night one, year one, year ten"
    architecture: "a suburban street, an equatorial beach, Rome and Chicago in winter, a launch pad left standing, a ship at sea, a mountain observatory"
    clothing: "ordinary clothes, winter coats, a sailor's oilskins, a launch technician's overalls"
    vehicles: "a ship steering by the ring, a rocket on a pad that never launches, a tram in a snowy Rome"
    street: "the ring band in every sky, a dead satellite dish, a sextant, a wall of snow against a Chicago door"
    light: "ringlight on everything at night (bright, silver, shadowless), dim winters under the ring shadow"
    palette: "ring silver, night cyan, winter grey, deep cyan accent"
    forbidden: "Saturn, spaceships, glowing effects, text, rocket explosions"
  cost: >-
    The strangest change is in the mind: for all of history the sky was open, and now it has a ceiling nobody can
    pass. No satellites, no weather maps, no space programme, and the most beautiful thing anyone has ever seen.
beats:
  - id: hook
    vo: >-
      What if Earth had rings tonight. You step outside and a bright band crosses the whole sky, horizon to horizon,
      as wide as your hand. It was not there yesterday.
    card: {text: "WHAT IF EARTH HAD RINGS TONIGHT", style: title}
  - id: hinge
    vo: >-
      A small moon strays too close and breaks apart, and the pieces spread into a flat disc of rock a thousand to ten thousand kilometres up. Here, that is tonight. This is how it happens.
    card: {text: "TONIGHT · THE HINGE", style: date}
  - id: phase1
    vo: >-
      Night one. The ring shines all night, so the dark is gone. From the equator it is edge-on, a thin bright line. Satellites start dying by morning.
    card: {text: "NIGHT ONE", style: phase}
  - id: phase2
    vo: >-
      Year one. The ring's shadow falls on the winter half, so from Cairo to Rome the midwinter sun is dimmed.
      Nights are too bright for owls and moths. Sailors steer by the ring.
    card: {text: "YEAR ONE", style: phase}
  - id: phase3
    vo: >-
      Year ten. Nothing goes higher than the ring. Any launch past it crosses a wall of rock at twenty-seven thousand kilometres an hour, so nobody tries. No new satellites, ever. The ring is a locked door.
    card: {text: "YEAR TEN", style: phase}
  - id: turn
    vo: >-
      [exhale] But the strangest change is in the mind. For all of history the sky was open. Now it has a ceiling nobody can pass.
    card: null
  - id: dilemma
    vo: >-
      That timeline never happened. Ours did. So: the most beautiful sky in the solar system, and no way out. Do you take it?
    card: {text: "The most beautiful sky in the solar system, and no way out. Do you take it?", style: question}
