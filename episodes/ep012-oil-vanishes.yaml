look_key_prompt: >-
  empty establishing frame of a six-lane motorway at dawn with cars and lorries stopped in every lane, doors open,
  a petrol station on the verge with its canopy lights off, mist, cold cyan light
research:
  hinge: >-
    At midnight every barrel of crude oil and every litre of petrol, diesel, jet fuel and bunker fuel ceases to
    exist. Natural gas, coal, uranium, wind and sun remain, so electricity mostly survives; what vanishes is
    the energy that moves things.
  hinge_date: "midnight"
  sources:
    - "IEA, Oil Market Report (2024): world oil demand about 103 million barrels a day; transport is roughly 60 percent of it"
    - "IEA, Aviation and Shipping tracking reports: jet fuel about 8 million barrels a day; marine bunkers about 5 million"
    - "UK Cabinet Office / Chatham House, Food supply resilience: supermarkets hold around three days of stock in just-in-time chains"
    - "UIC, Railway statistics: most of Europe's, China's and Japan's main lines are electrified; most of North America's are not"
    - "Smil, Energy and Civilization (2017), on the speed of pre-oil economies and the size of cities they could feed"
  facts:
    - "The world burns about a hundred million barrels of oil a day, most of it to move people and goods."
    - "Every airliner runs on jet fuel; every ocean freighter on bunker fuel; almost every lorry on diesel."
    - "Supermarkets in connected economies hold about three days of food; the lorries that restock them run on diesel."
    - "Electric railways, trams and metros keep running on gas, coal, nuclear and renewable electricity."
    - "Before oil, in nineteen hundred, the largest city on Earth held about six million people and was fed by rail, canal and horse."
    - "Harvests today are brought in by diesel machinery; by hand, a harvest takes the whole village."
  era_sheet:
    timeline: "the present day: day one, week two, year ten"
    architecture: "a motorway, an airport apron, a container port, a supermarket, a railway station, a market at a city's edge, a rebuilt tram city"
    clothing: "ordinary present-day clothes; work clothes and boots by week two"
    vehicles: "stopped cars and lorries (the lorry is the through-line), grounded airliners, drifting ships, a coal tug, electric trains, trams, bicycles, horses, sailing freighters"
    street: "petrol pumps with nozzles hanging, dead dashboards, empty shelves, bicycles, rail tracks, a lorry cab used as a market stall"
    light: "cold motorway dawn, hard apron noon, grey port morning, warm market evening, bright tram-city afternoon"
    palette: "asphalt grey, lorry white, rail rust, deep cyan accent"
    forbidden: "explosions, burning refineries, riots, glowing, text on signs"
  cost: >-
    The speed was the point: a city of twenty million eats because a lorry arrives every minute. At the old
    speed the biggest cities cannot be fed, so they empty. The world does not starve; it moves.
beats:
  - id: hook
    vo: >-
      What if oil vanished tonight. Every barrel, every tank, every drop in every engine. By breakfast every plane
      on Earth is grounded, and the cars are where they stopped.
    card: {text: "WHAT IF OIL VANISHED TONIGHT", style: title}
  - id: hinge
    vo: >-
      The world burns a hundred million barrels a day, most of it to move things. Here it is gone at midnight;
      the gas and coal stay. This is how it happens.
    card: {text: "MIDNIGHT · THE HINGE", style: date}
  - id: phase1
    vo: >-
      Day one. Cars coast to the kerb. Planes are grounded. Ships drift until a coal tug finds them. The electric
      trains run, so cities with them keep moving. Everyone else walks.
    card: {text: "DAY ONE", style: phase}
  - id: phase2
    vo: >-
      Week two. Supermarkets hold three days of food, and the lorries ran on diesel. Shelves empty, then markets
      reopen at the edge of every city, fed by rail, bicycle and horse. The harvest comes in by hand.
    card: {text: "WEEK TWO", style: phase}
  - id: phase3
    vo: >-
      Year ten. The world runs at nineteen hundred's speed with today's electricity. Trams, trains, sails and
      wires. Flying is a short electric hop. The cities are smaller, and the air is clean.
    card: {text: "YEAR TEN", style: phase}
  - id: turn
    vo: >-
      [exhale] But the speed was the point. A city of twenty million eats because a lorry arrives every minute.
      At the old speed the biggest cities cannot be fed, so they empty.
    card: null
  - id: dilemma
    vo: >-
      That timeline never happened. Ours did. So: does the world starve, or just slow down?
    card: {text: "Does the world starve, or just slow down?", style: question}
