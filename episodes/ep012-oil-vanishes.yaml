stamp_text: "UNHAPPENED"
voice:
  direction: "calm, dry, unhurried documentary narrator; lets facts land"
  elevenlabs_voice_id: ""
  model_id: eleven_v4
  settings: {stability: 0.5, similarity_boost: 0.75, style: 0.15, speed: 0.95}
music:
  mood: "sparse piano, a slowing engine-like pulse that settles into a tram-bell rhythm by phase three"
