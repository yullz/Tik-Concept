dilemma: "Does the world starve, or just slow down?"
pinned_comment: >-
  Slows down. The electricity stays, the trains run, and the harvest took the whole village for ten thousand
  years before diesel. The only thing that dies is the forty-minute commute, and nobody will mourn it.
metadata:
  cover_time: 0.6
  second_comment: >-
    Starves, in the cities. Three days of food on the shelves and the lorries gone; the countryside is fine and
    the megacities are not. Year ten is clean air for the people who survived week two.
  hashtags: ["#whatif", "#energy", "#science", "#oil", "#tomorrowmorning"]
  replies_to_prepare:
    - "Electric cars would be fine"
    - "Fertiliser comes from oil so everyone starves"
