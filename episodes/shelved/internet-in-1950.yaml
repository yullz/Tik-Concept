  with a paper roll beside the toaster, Bakelite radio, morning sun through gingham curtains
research:
  hinge: >-
    In July 1945 Vannevar Bush described the memex, a desk that could store and link every document; the transistor
    followed in December 1947. In this timeline the Soviet bomb test of August 1949 pushes Washington to fund Bush's
    machine as a continental defence network, and by 1952 a hundred universities are wired together.
  hinge_date: '1949'
  sources:
  - Vannevar Bush, As We May Think, The Atlantic, July 1945
  - >-
    Bell Labs, point-contact transistor demonstrated 16 December 1947 (Bardeen and Brattain), announced June 1948
  - Soviet RDS-1 test, 29 August 1949; US detection announced 23 September 1949
  - >-
    SAGE air-defence network, first operational 1958, AN/FSQ-7 computers with about 55,000 vacuum tubes each (MIT
    Lincoln Laboratory)
  - >-
    Janet Abbate, Inventing the Internet (1999), on ARPANET's open design and the first message of 29 October 1969
  - Senator McCarthy's Wheeling speech, 9 February 1950
  facts:
  - >-
    Bush ran the wartime Office of Scientific Research and Development and had the authority to build a national
    system.
  - >-
    The real SAGE network linked radar stations and computers across the continent by 1958; the parts existed a
    decade earlier.
  - >-
    In 1950 about nine percent of American households owned a television; a kitchen terminal would have been as
    strange as the radio was in 1920.
  - >-
    ARPANET's first message was sent on 29 October 1969; its open architecture was a scientific choice, not a military
    one.
  - >-
    A network built for air defence in 1950 would route every message through military switching centres.
  era_sheet:
    timeline: 1945, 1950 to 1965 America and Tokyo, and the present day of a world twenty years ahead
    architecture: >-
      1950 kitchens in Formica and chrome, wood-panelled offices, concrete government corridors, a 1965 suburban
      kitchen; today an ordinary city street with thin paper-like screens and no visible phones
    clothing: >-
      aprons and house dresses, grey flannel suits, shirtsleeves and ties, uniforms with brass buttons; today ordinary
      clothes
    vehicles: 1950 sedans, a 1965 station wagon, a modern tram
    street: >-
      teletype terminals with paper rolls, round CRT consoles in wood cabinets, vacuum-tube racks, punched cards,
      rotary phones, pipe smoke, gingham curtains
    light: >-
      warm morning kitchen sun, fluorescent machine rooms, sodium streetlight, overcast present-day rain
    palette: Formica cream, Bakelite brown, chrome, amber accent in filaments and lamps
    forbidden: neon, holograms, glowing interfaces, legible text on screens, flying cars, chrome robots
  cost: >-
    A network built by generals in 1950 has no off switch and no privacy by design: every search runs through a
    military switchboard during the McCarthy years. Ours was built by scientists who forgot to lock the doors, which
    is the only reason it belongs to its users.
beats:
- id: hook
  vo: >-
    What if the internet arrived in nineteen fifty. A modem rings in an Ohio kitchen. On the screen, a letter from
    Tokyo. Four seconds.
  card:
    text: WHAT IF THE INTERNET ARRIVED IN 1950
    style: title
- id: hinge
  vo: >-
    In nineteen forty-five Vannevar Bush described a desk that searched every book. Here, the Soviet bomb of forty-nine
    scares Washington into building it. By fifty-two a hundred universities are wired. This is how it happens.
  card:
    text: 1949 · THE HINGE
    style: date
- id: phase1
  vo: >-
    Year five. Messages arrive in seconds, so the letter dies first. Then the newspaper, because the morning edition
    is already old. Rooms of vacuum tubes run hot in every city. The power bill is classified.
  card:
    text: '1955'
    style: phase
- id: phase2
  vo: >-
    Year fifteen. The terminal moves into the kitchen. Every search runs through a Pentagon switchboard, because
    the Pentagon built it. The men who hunted communists in fifty-three hold everyone's reading list.
  card:
    text: '1965'
    style: phase
- id: phase3
  vo: >-
    Today. Computing is twenty years ahead, so your phone has been boring since two thousand five. What never arrived
    is privacy. Nobody here has ever been alone with a screen.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But a network built by generals has no off switch. Ours was built by scientists who forgot to lock
    the doors, which is the only reason it belongs to you.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. Twenty years ahead, every page you ever read on file. Would you log
    on?
  card:
    text: Twenty years ahead, every page you read on file. Would you log on?
    style: question
