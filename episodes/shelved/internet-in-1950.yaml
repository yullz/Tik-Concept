dilemma: Twenty years ahead, every page you read on file. Would you log on?
pinned_comment: >-
  I would log on. Everyone did, in our timeline too, the moment the terminal arrived. We just told ourselves nobody
  was reading the logs. In this one they say it out loud.
metadata:
  cover_time: 0.7
  second_comment: >-
    No. A network with a military switchboard at its centre never gets the web, never gets encryption for civilians,
    never gets the open protocols. Twenty years ahead in hardware, fifty years behind in freedom.
