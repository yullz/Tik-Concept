research:
  hinge: >-
    The Chicxulub impactor struck a shallow sea over sulphur-rich anhydrite rock off Yucatán; the sulphur aerosols
    caused years of darkness and cold. Earth rotates fifteen degrees an hour, so an arrival twenty minutes later
    puts the same rock about five hundred kilometres east, in the deep Gulf of Mexico: a catastrophe, not an extinction.
  hinge_date: 66 million years ago
  sources:
  - >-
    Kaiho & Oshima, Site of asteroid impact changed the history of life on Earth, Scientific Reports 7, 14855 (2017):
    only about 13 percent of Earth's surface was rich enough in hydrocarbons and sulphur to cause the extinction
  - >-
    Gulick et al., The first day of the Cenozoic, PNAS 116 (2019): the drill core from the crater and the sulphur-bearing
    target rock
  - >-
    Schulte et al., The Chicxulub asteroid impact and mass extinction at the Cretaceous-Paleogene boundary, Science
    327 (2010)
  - >-
    Gerkema et al., The nocturnal bottleneck and the evolution of activity patterns in mammals, Proc. R. Soc. B
    280 (2013)
  - >-
    Dale Russell & Ron Séguin, Reconstructions of the small Cretaceous theropod Stenonychosaurus and a hypothetical
    dinosauroid (1982)
  facts:
  - >-
    The impactor was roughly ten kilometres wide and left a crater about one hundred and eighty kilometres across.
  - >-
    About three quarters of species on Earth died, including every non-avian dinosaur; birds are the surviving dinosaurs.
  - >-
    Non-avian dinosaurs had been the dominant land animals for about one hundred and sixty-five million years.
  - >-
    Mammals had existed alongside them for over a hundred million years, mostly small and nocturnal.
  - >-
    Grasslands spread tens of millions of years after the impact; grazing herds are a Cenozoic invention.
  - >-
    Earth turns fifteen degrees of longitude per hour: twenty minutes is about five hundred kilometres at that latitude.
  era_sheet:
    timeline: >-
      Late Cretaceous (sixty-six million years ago), then ten million years on, then the present day of a world
      without the extinction
    architecture: none; landscapes only
    clothing: none; no humans exist in this timeline after the hinge
    vehicles: none
    street: >-
      tree ferns, cycads, magnolias, palms, araucaria conifers, horsetails; later grasslands and snowy northern
      plains
    light: >-
      warm tropical dawn on the coastal plain; hard noon over the deep Gulf; cold blue dusk on the northern grassland
    palette: >-
      fern green, sediment ochre, deep sea blue, crimson accent in the sky at impact and in flank feathers
    forbidden: >-
      roaring at camera, scaly tyrannosaurs, volcanoes everywhere, humans, vehicles, Hollywood theme-park framing,
      text
  cost: >-
    The extinction made room. Every large mammal, every primate, every human needed plains that dinosaurs had stopped
    grazing. Without the impact on that sulphur rock, mammals likely stay small and nocturnal, and no one is here
    to film this.
beats:
- id: hook
  vo: >-
    What if the asteroid missed. Sixty-six million years ago, it arrives twenty minutes late and hits deep water.
    The dinosaurs never die.
  card:
    text: WHAT IF THE ASTEROID MISSED
    style: title
- id: hinge
  vo: >-
    The real rock hit shallow sea over sulphur-rich stone, which blacked out the sun for years. Here, Earth turns
    twenty more minutes, so it lands in deep water. This is how it happens.
  card:
    text: 66,000,000 YEARS AGO · THE HINGE
    style: date
- id: phase1
  vo: >-
    Day one. A wave a kilometre high crosses the Atlantic. Nothing within a thousand kilometres survives it. But
    the sky stays blue, because deep water holds no sulphur. By spring, the herds are grazing again.
  card:
    text: DAY ONE
    style: phase
- id: phase2
  vo: >-
    Ten million years later. The dinosaurs are still here, so the mammals are still small. Nothing bigger than a
    cat lives on the ground. Mammals stay in the dark.
  card:
    text: TEN MILLION YEARS LATER
    style: phase
- id: phase3
  vo: >-
    Today. Grass covers the plains from Texas to the Arctic, grazed by horned dinosaurs the size of a bus. Winters
    come, so the northern herds grow thick down. There are no apes. There are no cities.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But the cost is us. Every mammal that ever got big, every primate, every human, needed those empty
    plains. The asteroid did not just end the dinosaurs. It made room.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: with sixty-six million more years, do they ever build a city?
  card:
    text: With sixty-six million more years, do they ever build a city?
    style: question
