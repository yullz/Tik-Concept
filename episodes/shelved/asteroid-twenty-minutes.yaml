dilemma: With sixty-six million more years, do they ever build a city?
pinned_comment: >-
  No. Intelligence is not a destination. One hundred and sixty-five million years of dinosaurs produced brilliant
  hunters and zero tools. A mind was the mammals' accident, and the accident needed the asteroid.
metadata:
  cover_time: 3.1
  second_comment: >-
    Crows and parrots are dinosaurs, and they use tools and plan ahead. Give that lineage sixty-six million extra
    years with no competition and a city is not even the strange outcome.
