research:
  hinge: >-
    On the tenth of October 1492, after thirty-three days out of the Canaries, the crews protested and the voyage
    nearly ended; Columbus talked them into continuing and land was sighted at two in the morning on the twelfth.
    In this timeline he turns east on the tenth.
  hinge_date: 10 October 1492
  sources:
  - Columbus, Diario (Las Casas abstract), entries for 10, 11 and 12 October 1492
  - >-
    Fernández de Oviedo, Historia general y natural de las Indias (1535), the three-days bargain tradition; Pleitos
    colombinos testimony on Martín Alonso Pinzón
  - >-
    Pero Vaz de Caminha, letter to King Manuel on Cabral's landfall at Porto Seguro, 22 April to 1 May 1500
  - >-
    Alfred Crosby, The Columbian Exchange (1972), on smallpox reaching Hispaniola in 1518 and Mexico in 1520
  - Letters patent of Henry VII to John Cabot (1496) and the 1497 Newfoundland landfall
  facts:
  - >-
    Three ships left Palos on the third of August 1492 and the Canaries on the sixth of September.
  - >-
    Columbus underestimated the distance to Asia by thousands of kilometres; the crew's fear on the tenth was rational.
  - Vasco da Gama reached Calicut on the twentieth of May 1498 by the Cape route.
  - >-
    Cabral, bound for India, swung west and landed in Brazil in April 1500; Cabot reached Newfoundland for England
    in June 1497.
  - >-
    The Treaty of Tordesillas (1494) divided new lands between Castile and Portugal; without the 1492 landfall it
    is never signed in that form.
  - >-
    Old World diseases killed the majority of the Indigenous population of the Americas within a century of contact,
    whichever flag arrived.
  era_sheet:
    timeline: >-
      1492 at sea; 1498 to 1500 Lisbon, the Indian Ocean and the Brazilian coast; the present day of a Portuguese-and-English
      Americas
    architecture: >-
      Palos and Lisbon quays in limestone and timber, Belém riverside; today a Caribbean port with azulejo-tiled
      facades and Portuguese ironwork; a clapboard Newfoundland fishing town
    clothing: >-
      1492 sailors in wool caps, loose linen shirts and hose, the admiral in a dark wool gown; Tupiniquim men with
      feather ornaments and body paint, depicted with dignity; today ordinary clothes
    vehicles: >-
      a nao and two caravels with square and lateen sails, Portuguese carracks with the red cross of the Order of
      Christ on the sails, galleys in Valencia, Portuguese trams today
    street: >-
      hemp rigging, a half-hour sandglass on the binnacle, oak decks, parchment charts with dividers (lettering
      illegible), brazilwood logs, parrots in cages
    light: >-
      grey Atlantic dawn and dusk, Lisbon window light, hard Indian Ocean noon, Brazilian Easter-week morning, Caribbean
      tropical light
    palette: >-
      oak brown, hemp ochre, grey-green sea, crimson accent on the Portuguese sails and the sandglass frame
    forbidden: >-
      modern flags, Hollywood pirates, cannon battles, native peoples shown as savages or in crowds of extras, text
      on charts
  cost: >-
    The ships still carry smallpox. Portugal's Cabral reaches Brazil in 1500 and England's Cabot touches Newfoundland
    in 1497 regardless; the great dying of the Americas happens anyway, eight years late. Columbus only ever changed
    the flag on the beach.
beats:
- id: hook
  vo: >-
    What if Columbus turned back. October tenth, fourteen ninety-two. The crew offers three more days. He says no.
    Two days later, nobody sights land.
  card:
    text: WHAT IF COLUMBUS TURNED BACK
    style: title
- id: hinge
  vo: >-
    On the tenth of October the crew had had enough. In our world he won three more days, and on the twelfth they
    saw land. Here, he turns east. This is how it happens.
  card:
    text: 10 OCTOBER 1492 · THE HINGE
    style: date
- id: phase1
  vo: >-
    Year one. Columbus returns to Spain as a failure, so Spain stops looking west. Portugal keeps going south, around
    Africa. Vasco da Gama reaches India in fourteen ninety-eight, and the spice money flows to Lisbon.
  card:
    text: YEAR ONE
    style: phase
- id: phase2
  vo: >-
    Year eight. The Atlantic does what it always does. A Portuguese fleet bound for India swings wide, so in April
    fifteen hundred Cabral lands in Brazil anyway. Cabot has already touched Newfoundland for England.
  card:
    text: YEAR EIGHT
    style: phase
- id: phase3
  vo: >-
    Today. The Caribbean speaks Portuguese. The north, English, a century earlier than it did. Castile, with no
    silver from the Andes, stays a Mediterranean power, so there is no Spanish Armada and no Spanish Empire.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But the ships still carry smallpox. The great dying of the Americas happens anyway, eight years late.
    The only thing Columbus ever changed was the flag on the beach.
  card: null
- id: dilemma
  vo: 'That timeline never happened. Ours did. So who was the hinge: the man, or the wind?'
  card:
    text: 'Who was the hinge: the man, or the wind?'
    style: question
