dilemma: 'Who was the hinge: the man, or the wind?'
pinned_comment: >-
  The wind. Cabral hit Brazil in fifteen hundred by accident on the way to India, Cabot hit Newfoundland in fourteen
  ninety-seven. The Atlantic currents were a conveyor belt; somebody was always getting on it.
metadata:
  cover_time: 3.4
  second_comment: >-
    The man. Eight years is not nothing: it is the Treaty of Tordesillas, it is Andean silver going to Castile instead
    of Lisbon, it is the whole shape of the Spanish Empire. Timing is the hinge.
