dilemma: Fifty million live. Europe stays poor. Do you take the trade?
pinned_comment: >-
  I take it. Fifty million people is fifty million people. The modern world would still have arrived, from somewhere,
  a century late. A century is nothing. A grandmother is not.
metadata:
  cover_time: 0.6
  second_comment: >-
    No. A crowded feudal Europe is not the same number of people living gently; it is famine every decade, serfdom
    until the nineteen hundreds, and no vaccines, ever. The plague paid for the vaccines.
