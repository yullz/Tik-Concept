research:
  hinge: >-
    In October 1347 Genoese galleys from Kaffa on the Black Sea brought plague into Messina; within five years the
    pandemic killed roughly a third to a half of Europe's population. In this timeline a storm sinks the galleys
    off Crete and the plague never crosses.
  hinge_date: October 1347
  sources:
  - 'Ole Benedictow, The Black Death 1346-1353: The Complete History (2004)'
  - >-
    Michele da Piazza, Chronica (the Messina arrival, October 1347); Gabriele de' Mussis, Historia de Morbo (Kaffa)
  - >-
    Voigtländer & Voth, The Three Horsemen of Riches: Plague, War, and Urbanization in Early Modern Europe, Review
    of Economic Studies 80 (2013)
  - >-
    Robert Allen, The British Industrial Revolution in Global Perspective (2009), on high wages and mechanisation
  - >-
    Statute of Labourers (1351) and the English Rising of 1381, as consequences of the labour shortage
  facts:
  - >-
    Europe held roughly seventy-five million people before the plague; between twenty-five and fifty million died
    by 1353.
  - Labour became scarce, so real wages in England roughly doubled over the following century.
  - Lords tried to freeze wages by law in 1351; the Rising of 1381 was the response.
  - >-
    Economists argue the plague's high wages pushed Europe toward labour-saving machines and later toward industry.
  - >-
    Famine had struck Europe in 1315 to 1317 because population had outrun the land; without the plague that pressure
    stays.
  era_sheet:
    timeline: >-
      1347 Messina; 1357 and 1447 rural and urban Europe; the present day of a crowded, poor, aristocratic Europe
    architecture: >-
      limestone harbour moles and warehouses, wattle-and-daub villages, walled towns with timber-framed houses;
      today intact palaces behind high walls with brick slums at their feet, mills on rivers, no factories
    clothing: >-
      serfs in undyed wool tunics and hoods, lords in fur-trimmed wool, bailiffs with staffs; today worn wool, bicycles,
      caps, few cars
    vehicles: Genoese galleys, ox carts, water mills; today bicycles and horse carts, a rare car
    street: scythes, an iron-bound wooden grain measure, strip fields, tally sticks, coal smoke
    light: >-
      stormy night at sea, grey Messina dawn, summer harvest light, grey famine winter, smoky morning today
    palette: wool grey, straw gold, limestone, crimson accent on the grain measure's iron bands
    forbidden: skeletons, plague doctor masks, rats as a motif, cartoon squalor, text
  cost: >-
    The plague was the worst thing that ever happened to Europe and the reason it got rich: high wages bought machines,
    empty land bought freedom, and fifty million deaths bought the modern world. Without it Europe stays crowded,
    poor and feudal.
beats:
- id: hook
  vo: >-
    What if the Black Death never came. Thirteen forty-seven. Twelve ships from Kaffa sail into Messina. Here, a
    storm sinks them off Crete. Fifty million people live.
  card:
    text: WHAT IF THE BLACK DEATH NEVER CAME
    style: title
- id: hinge
  vo: >-
    Plague reached Europe on Genoese ships in thirteen forty-seven. In five years it killed a third of the continent.
    Here, the ships never arrive. This is how it happens.
  card:
    text: OCTOBER 1347 · THE HINGE
    style: date
- id: phase1
  vo: >-
    Year ten. Fifty million people are alive, so there is no shortage of hands. Wages stay low. Serfs stay serfs,
    because a lord can always find another. The peasant revolts never come.
  card:
    text: '1357'
    style: phase
- id: phase2
  vo: >-
    Year one hundred. Every field is farmed, so every bad harvest is a famine. Nobody buys a machine that saves
    labour, because labour is cheaper than iron. The printing press waits.
  card:
    text: '1447'
    style: phase
- id: phase3
  vo: >-
    Today. Europe has a billion people and the income of Bangladesh. Land is everything, so the nobility never left.
    Industry starts somewhere the plague did reach, a century late, not here.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But the ledger is uncomfortable. The plague was the worst thing that happened to Europe, and the reason
    it got rich. High wages bought machines. Empty land bought freedom. Fifty million deaths bought the modern world.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: fifty million live, and Europe stays poor. Do you take that trade?
  card:
    text: Fifty million live. Europe stays poor. Do you take the trade?
    style: question
