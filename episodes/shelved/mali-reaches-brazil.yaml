  empty establishing frame of a wide West African river mouth at dawn, mud-brick buildings with timber torons on
  the bank, indigo cloth drying on a line, dugout pirogues, the Atlantic grey beyond the bar, warm haze
research:
  hinge: >-
    According to al-Umari, who recorded Mansa Musa's own account given in Cairo in 1324, Musa's predecessor sent
    two hundred ships into the Atlantic, then sailed himself with two thousand, and never returned; Musa took the
    throne in 1312 as a result. In this timeline the Canary and Equatorial currents carry the fleet to the coast
    of Brazil.
  hinge_date: '1312'
  sources:
  - >-
    al-Umari, Masalik al-absar fi mamalik al-amsar (c. 1337-38), in Levtzion & Hopkins, Corpus of Early Arabic Sources
    for West African History (1981)
  - Nehemia Levtzion, Ancient Ghana and Mali (1973)
  - >-
    Michael Gomez, African Dominion: A New History of Empire in Early and Medieval West Africa (2018)
  - >-
    NOAA Ocean Service, the Canary Current and North Equatorial Current flow west from West Africa toward the Caribbean
    and northern Brazil
  - >-
    Pero Vaz de Caminha, letter on the Portuguese landfall in Brazil, 1500 (for what the Portuguese found in our
    timeline)
  facts:
  - >-
    Mansa Musa's pilgrimage of 1324 carried so much gold that Cairo's gold price stayed depressed for years.
  - >-
    Mali controlled the trans-Saharan gold trade and a large share of the Old World's gold supply in the fourteenth
    century.
  - Timbuktu's scholars and the Sankore mosque made Mali a centre of Islamic learning.
  - The Tupi peoples of coastal Brazil lived in longhouse villages and farmed manioc.
  - >-
    Smallpox and measles were endemic in the Old World, Africa included, and arrived in the Americas with the first
    sustained contact.
  - In our timeline the Portuguese reached Brazil in April 1500.
  era_sheet:
    timeline: 1312 to 1412, the Portuguese arrival of 1500, and the present day
    architecture: >-
      banco mud-brick with projecting timber torons and conical pinnacles, Tupi thatched longhouses; today a river
      metropolis of stepped concrete with toron-like studs, mosques with tapering mud-brick-styled minarets
    clothing: >-
      indigo-dyed cotton robes and wrapped head cloths, gold ear and nose ornaments, cowrie belts; Tupi men and
      women with feather ornaments and red urucum body paint, depicted with dignity; Portuguese sailors in linen
      and wool; today ordinary tropical clothes with indigo cloth common
    vehicles: >-
      large lashed-plank ships with square indigo cotton sails and steering oars, Niger pirogues, Tupi dugouts,
      Portuguese carracks, today river ferries
    street: >-
      gold dust in leather bags, cowries, manioc baskets, indigo cloth on lines, red earth, Atlantic forest
    light: warm Sahel dawn, hard equatorial noon, green river light under forest, tropical dusk
    palette: red earth, indigo, gold, forest green, imperial gold accent
    forbidden: >-
      Egyptian pyramids, tribal caricature, Hollywood jungle clichés, text, European flags before 1500
  cost: >-
    Contact kills in every timeline: the fleet carries measles and smallpox as surely as any caravel, so the great
    dying of the Americas begins in 1312 instead of 1492. First contact changes the century and the language of
    a continent; it never changes the virus.
beats:
- id: hook
  vo: >-
    What if Mali found America first. Thirteen twelve. Two thousand ships sail west from Africa. In our world they
    vanished. Here, they land in Brazil.
  card:
    text: WHAT IF MALI FOUND AMERICA FIRST
    style: title
- id: hinge
  vo: >-
    Mansa Musa told Cairo that the ruler before him sailed west with two thousand ships and never returned. Here
    the current delivers them to Brazil. This is how it happens.
  card:
    text: 1312 · THE HINGE
    style: date
- id: phase1
  vo: >-
    Year one. The fleet lands in Brazil, so first contact between the worlds is Malinke and Tupi: gold for manioc.
    No horses, no guns. By year ten there are mud mosques on the Amazon.
  card:
    text: '1313'
    style: phase
- id: phase2
  vo: >-
    Year one hundred. The gold that built Timbuktu now builds ports. The Atlantic is a Malian sea, so when the Portuguese
    arrive in fifteen hundred they find harbours, tariffs and scholars.
  card:
    text: '1412'
    style: phase
- id: phase3
  vo: >-
    Today. The largest city in the Americas sits at the mouth of the Amazon, because the first port was there. Half
    of South America speaks a Malinke creole. The call to prayer carries over the river.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But contact kills in every timeline. The fleet carries smallpox, so the great dying begins in thirteen
    twelve, not fourteen ninety-two. It changes the century. Never the virus.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. First contact from Africa, not Europe: less slavery, or just a different
    master?
  card:
    text: 'First contact from Africa: less slavery, or a different master?'
    style: question
