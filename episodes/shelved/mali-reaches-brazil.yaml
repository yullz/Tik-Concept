dilemma: 'First contact from Africa instead of Europe: less slavery, or just a different master?'
pinned_comment: >-
  A different master. Mali ran on gold, salt and captives like every empire of its century. A Malian Atlantic has
  plantations by fourteen hundred; the only question is who is working them.
metadata:
  cover_time: 0.8
  second_comment: >-
    Less. The Atlantic slave trade needed sugar, cannon, and a two-century head start for European ships. A Malian
    Brazil trading gold for manioc without horses or guns is a trading world, not a plantation one.
