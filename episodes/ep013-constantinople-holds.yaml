dilemma: Does a surviving Constantinople delay America, or just change the flag?
pinned_comment: >-
  Delays it. Portugal spent eighty years and a fortune going round Africa because the overland routes closed behind
  the Ottomans. With the Black Sea open, nobody funds Columbus. The flag never matters; the invoice does.
metadata:
  cover_time: 0.9
  second_comment: >-
    The Portuguese were already past Cape Bojador in fourteen thirty-four, two decades before the siege. The Atlantic
    was coming either way. A surviving city changes who pays for the ships, not whether they sail.
