research:
  hinge: >-
    In 1452 the gun founder Orban offered his great bombard to Constantine XI, who could not pay him or supply the
    bronze; Orban then sold it to Mehmed II for four times the price, and in 1453 it breached the walls. In this
    timeline the emperor melts church silver, pays, and the gun defends the walls instead.
  hinge_date: '1452'
  sources:
  - >-
    Doukas, Decline and Fall of Byzantium to the Ottoman Turks, ch. 35 (Orban's offer to the emperor and his sale
    to the Sultan)
  - Steven Runciman, The Fall of Constantinople 1453 (1965)
  - 'Roger Crowley, Constantinople: The Last Great Siege, 1453 (2005)'
  - >-
    Jonathan Harris, Greek Emigres in the West 1400-1520 (1995), on scholars leaving before and after 1453
  - Marios Philippides & Walter Hanak, The Siege and the Fall of Constantinople in 1453 (2011)
  facts:
  - >-
    The siege ran from the sixth of April to the twenty-ninth of May 1453; about eight thousand defenders faced
    an army of sixty to eighty thousand.
  - >-
    Orban's bombard was roughly eight metres long, fired stone balls of around six hundred kilograms and needed
    sixty oxen to move.
  - >-
    Mehmed II was twenty-one; his father Murad II had been pushed off and back onto the throne within a decade,
    so a failed siege could have ended him.
  - >-
    The Theodosian walls had held every siege for a thousand years; the gun was the difference.
  - >-
    Greek scholars had been moving to Italy since Chrysoloras arrived in Florence in 1397, so the Renaissance effect
    is a slowdown, not a stop.
  - >-
    Genoa and Venice ran the Black Sea trade through the city; the Ottoman closure helped push Portugal toward the
    Cape route.
  era_sheet:
    timeline: 1452 to 1453, the sixteenth century, and the present day of a surviving city-state
    architecture: >-
      banded brick-and-limestone walls and towers, the great church's dome and buttresses, cypress gardens; today
      low domed skyline, a suspension bridge with bronze double-headed eagles, harbour cranes
    clothing: >-
      court in dark silk with gold borders, Genoese mercenaries in brigandine and sallets, gunners in leather aprons,
      Ottoman officers in kaftans and turbans; today ordinary clothes and joggers
    vehicles: the bronze bombard on a timber carriage, oxen, Genoese galleys; today trams and ferries
    street: church silver on scales, bronze, stone cannonballs, tents, cypress, modern tram stops
    light: cold Marmara dawn, foundry fire, torch-lit walls at night, bright Bosphorus morning today
    palette: limestone cream, brick red, Marmara grey, imperial gold accent
    forbidden: >-
      crescent flags over the city, minarets on the great church, glass towers, Hollywood battle gore, text
  cost: >-
    A city that never falls never has to leave. The scholars who carried Greek to Florence stay home and the overland
    spice trade stays open, so the Renaissance runs slower and nobody needs an Atlantic route for another century.
beats:
- id: hook
  vo: >-
    What if Constantinople never fell. Fourteen fifty-three. The cannon that breaks the walls is Byzantine, because
    the emperor paid the invoice. The city is still Rome.
  card:
    text: WHAT IF CONSTANTINOPLE NEVER FELL
    style: title
- id: hinge
  vo: >-
    In fourteen fifty-two a founder named Orban offered his cannon to the emperor first. Constantine could not pay,
    so Orban sold it to the Sultan. Here, the emperor melts church silver and pays. This is how it happens.
  card:
    text: 1452 · THE HINGE
    style: date
- id: phase1
  vo: >-
    Year one. The great gun sits on the walls, so the siege of fourteen fifty-three breaks on them. Mehmed, twenty-one,
    loses his army and his throne. The Ottoman state splits in three.
  card:
    text: '1453'
    style: phase
- id: phase2
  vo: >-
    Year one hundred. Venice and Genoa keep the Black Sea trade, so silk and spice still flow overland. Nobody needs
    a sea route to India, so Lisbon stays a fishing town.
  card:
    text: '1553'
    style: phase
- id: phase3
  vo: >-
    Today. Constantinople is a city-state of four million, like Singapore with a fifth-century wall. The great church
    is still a church, because nobody ever took it. The double eagle flies on the bridge.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But a city that never falls never has to leave. The scholars who carried Greek to Florence stay home,
    so the Renaissance runs slow and the Atlantic waits a century.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. Does a surviving Constantinople delay America, or just change the flag?
  card:
    text: Does a surviving Constantinople delay America, or just change the flag?
    style: question
