research:
  hinge: >-
    At midnight the Moon and its mass are simply gone. Tides, night light and the long-term stability of Earth's
    axial tilt all depend on it; each fails on its own timescale.
  hinge_date: tonight
  sources:
  - >-
    Laskar, Joutel & Robutel, Stabilization of the Earth's obliquity by the Moon, Nature 361 (1993)
  - >-
    NOAA Tides and Currents, tidal forces: the Moon's tide-raising force is about 2.2 times the Sun's; Bay of Fundy
    range up to about 16 metres
  - >-
    Harrison et al., Mass spawning in tropical reef corals, Science 223 (1984): spawning timed to the lunar cycle
  - >-
    Dacke et al., Insect orientation to polarized moonlight, Nature 424 (2003): dung beetles steer by the Moon
  - >-
    Canup, Forming a Moon with an Earth-like composition, Science 338 (2012); early Earth's day after the Moon-forming
    impact was a few hours long and lengthened by lunar tidal braking
  facts:
  - Moonlight on a full-moon night is roughly a hundred times brighter than starlight alone.
  - >-
    Remove the Moon and tides shrink to about a third, the solar share; Fundy's sixteen metres become about five.
  - >-
    Corals on the Great Barrier Reef spawn in the nights after a full moon; dung beetles and many moths navigate
    by the Moon.
  - >-
    The Moon stabilises Earth's tilt near twenty-three degrees; without it the tilt can wander chaotically over
    millions of years.
  - >-
    Earth's day was only a few hours long after the Moon formed; four and a half billion years of lunar tides stretched
    it to twenty-four.
  era_sheet:
    timeline: the present day, then a decade on, then a million years on
    architecture: >-
      real places: a Tokyo balcony, a Bay of Fundy headland and lighthouse, a Queensland dive boat, a Namibian desert
      road
    clothing: present-day ordinary clothing, a park ranger's uniform, a diver's wetsuit
    vehicles: a dive boat, a pickup, leaning fishing boats in a dry estuary
    street: >-
      lighthouse, tide clock, mudflats, exposed oyster beds, coral under a dive lamp, turtle tracks on sand
    light: >-
      starlight only at night (very dark), sodium lamps, dawn over mudflats; the million-year frames use low tilted
      sun
    palette: midnight blue, wet rock black, sodium amber, deep cyan accent
    forbidden: a visible moon, fantasy skies, glowing objects, text, a second moon, explosions
  cost: >-
    The quiet cost comes first: the Moon's pull slowed Earth's spin from a few hours to a twenty-four-hour day,
    kept the tilt steady, set every tide and most calendars, and was the only other world anyone ever stood on.
beats:
- id: hook
  vo: >-
    What if the Moon vanished tonight. You wake, look up, and there is a hole in the sky where it was. The tide
    has already noticed.
  card:
    text: WHAT IF THE MOON VANISHED TONIGHT
    style: title
- id: hinge
  vo: >-
    At midnight the Moon is gone. No impact, no debris, just absence. Earth loses what pulled on it for four
    and a half billion years. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    First night. Every night is a new-moon night now; full moonlight was a hundred times brighter than the stars. Tides shrink to a third, so Fundy's sixteen metres become five. Corals that spawn by the full Moon miss their night.
  card:
    text: FIRST NIGHT
    style: phase
- id: phase2
  vo: >-
    Year ten. The tide is a third of itself, so the estuary nurseries shrink, and the fisheries with them. Lunar calendars lose their month. Moths lose their compass. Leatherback hatchlings circle longer before they find the sea.
  card:
    text: YEAR TEN
    style: phase
- id: phase3
  vo: >-
    Millions of years on. The Moon kept Earth's tilt steady. Without it the axis wanders by tens of degrees, so climates lurch between ice age and furnace.
  card:
    text: ONE MILLION YEARS
    style: phase
- id: turn
  vo: >-
    [exhale] But the quiet cost comes first. The Moon's pull is why a day lasts twenty-four hours, not six. It was our brake, our clock, the only other place anyone walked.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So which ends us first: the dark, the tide, or the tilt?
  card:
    text: 'Which ends us first: the dark, the tide, or the tilt?'
    style: question
