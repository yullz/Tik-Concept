dilemma: 'Which ends us first: the dark, the tide, or the tilt?'
pinned_comment: >-
  The tide. Not the water, the fisheries. Estuaries are nurseries for most of what we eat from the sea, and they
  run on tidal mixing. The dark is a mood; the tilt is millions of years away. Argue.
metadata:
  cover_time: 3.4
  second_comment: >-
    The dark, and fast. Insect navigation, nocturnal pollination, turtle hatchlings, coral spawning: the night ecosystem
    is the first thing that breaks, and we eat what it feeds.
