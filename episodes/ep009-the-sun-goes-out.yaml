dilemma: 'Where do the last people live: the volcano, or the deep?'
pinned_comment: >-
  The volcano. Iceland already heats its homes and grows tomatoes on geothermal steam, and the steam does not care whether the Sun is there. The deep sea feeds crabs. It does not feed ten thousand people.
metadata:
  cover_time: 0.8
  second_comment: >-
    The deep. Vent microbes have lived on the Earth's own heat for billions of years; a volcano is a surface bet in a world cooling toward minus two hundred. Go where the heat comes from.
