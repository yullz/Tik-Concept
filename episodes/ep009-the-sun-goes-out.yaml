look_key_prompt: >-
  empty establishing frame of a suburban kitchen window at the last minute of daylight, a potted plant on the sill,
  a garden outside lit by a sun that is about to vanish, long shadows, warm light edged with cold cyan
research:
  hinge: >-
    At midnight the Sun ceases to exist. Its last light takes eight minutes and twenty seconds to arrive; after
    that the sky is black, the Earth travels on in a straight line, and the planet cools on a timetable set by the
    heat it already holds and the heat its own core still produces.
  hinge_date: tonight
  sources:
  - >-
    David Stevenson (Caltech) in Popular Science, What would happen if the Sun disappeared: below minus eighteen within a week, about minus seventy within a year, ocean surfaces freeze while deep water stays liquid
  - >-
    NASA, Sun Fact Sheet: light travel time about 499 seconds; Earth's orbital speed about 30 km/s
  - >-
    Stevenson, Life-sustaining planets in interstellar space?, Nature 400 (1999): geothermal heat can keep water
    liquid on a starless planet
  - >-
    Abbot & Switzer, The Steppenwolf: a proposal for a habitable planet in interstellar space, ApJ Letters 735 (2011):
    an ice-covered ocean kept liquid by geothermal heat
  - >-
    Van Dover, The Ecology of Deep-Sea Hydrothermal Vents (2000): vent ecosystems that do not depend on sunlight
  facts:
  - >-
    The last sunlight arrives eight minutes and twenty seconds after the Sun is gone; nothing changes until then.
  - >-
    Within a week the global average falls below freezing; within a year it is around minus seventy.
  - >-
    Oceans freeze from the top; the ice insulates the water beneath, which stays liquid for a very long time on
    the core's heat.
  - >-
    Photosynthesis stops at once, so plants die within weeks; stored food and geothermal greenhouses are what remain.
  - >-
    Hydrothermal vent communities live on chemical energy from the Earth itself and would not notice the Sun had
    gone.
  - >-
    Geothermal regions like Iceland, with geothermal electricity for light, are the plausible last human settlements.
  era_sheet:
    timeline: 'the present day: the last eight minutes, week one, year one, year one hundred'
    architecture: >-
      a suburban kitchen and garden, a city at dusk, a frozen harbour, a geothermal greenhouse on a lava field,
      a geothermal plant hall, a deep-sea vent
    clothing: ordinary clothes, then parkas, then expedition suits in year one hundred
    vehicles: a car with headlights on in a frozen street, a snowcat, a submersible
    street: >-
      a kitchen window with a potted plant, frost ferns on glass, a candle, grow lamps, steam from a vent, ice-sheathed
      cities
    light: >-
      the last warm sunset, then starlight only, candle and sodium grow-lamp light, the orange glow of vents
    palette: last-light amber, frost blue, starfield black, deep cyan accent
    forbidden: explosions, a visibly exploding sun, fireballs, glowing effects, text, panic crowds
  cost: >-
    Nothing is destroyed. Every mountain and city is perfectly preserved in the cold; the loss is that we built
    a world that only works with the lights on.
beats:
- id: hook
  vo: >-
    What if the Sun went out tonight. Not set. Out. You would not know for eight minutes. Then the sky goes black,
    and the Earth starts to coast.
  card:
    text: WHAT IF THE SUN WENT OUT TONIGHT
    style: title
- id: hinge
  vo: >-
    Light takes eight minutes to reach us, so for eight minutes nothing changes. Then the sky goes dark and the
    Earth flies on in a straight line. This is how it happens.
  card:
    text: MIDNIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Week one. The planet still holds its heat, so the first days are a long cold dusk. Plants stop at once. By day seven it is minus eighteen degrees.
  card:
    text: WEEK ONE
    style: phase
- id: phase2
  vo: >-
    Year one. Minus seventy. The oceans freeze over, but under the lid they stay liquid, because the ice holds the stored heat in. The last farms are greenhouses on Iceland's lava fields, lit by the island's own geothermal power.
  card:
    text: YEAR ONE
    style: phase
- id: phase3
  vo: >-
    Year one hundred. The surface is a frozen desert under stars. The deep sea has not noticed yet: hot vents still feed crabs and worms in the dark. Humanity is a few warm holes, perhaps ten thousand people.
  card:
    text: YEAR ONE HUNDRED
    style: phase
- id: turn
  vo: >-
    [exhale] But nothing is destroyed. Every mountain, every city, perfectly preserved in the cold. We built a world
    that only works with the lights on.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: where do the last people live, the volcano, or the deep?
  card:
    text: 'Where do the last people live: the volcano, or the deep?'
    style: question
