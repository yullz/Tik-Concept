dilemma: 'Twenty-three hours a day: more freedom, or more work?'
pinned_comment: >-
  More work. Every hour humans have ever freed up, from the loom to the dishwasher, got filled by a job within a
  generation. Seven hours a day is the biggest productivity gain in history, and it will not be yours.
metadata:
  cover_time: 0.8
  second_comment: >-
    More freedom. A hundred extra days a year and the first thing to die is the alarm clock. Work expands to fill
    the day only if we let it, and a planet that is never tired has time to argue about that.
