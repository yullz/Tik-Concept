research:
  hinge: >-
    Adults need about seven to nine hours of sleep because the brain clears waste and consolidates memory while
    we are unconscious. In this timeline the same work gets done in sixty minutes, for everyone, starting tonight.
  hinge_date: tonight
  sources:
  - >-
    Xie et al., Sleep drives metabolite clearance from the adult brain, Science 342 (2013): the glymphatic system
    clears waste mainly during sleep
  - Walker & Stickgold, Sleep-dependent learning and memory consolidation, Neuron 44 (2004)
  - >-
    National Sleep Foundation / Hirshkowitz et al. (2015): adults need 7-9 hours; about a third of life is spent
    asleep
  - >-
    Matthew Walker, Why We Sleep (2017), on what short sleep does to the body and on the economics of the night
  - >-
    US EIA, hourly electricity demand profiles: overnight demand is typically a third below the daytime peak
  facts:
  - >-
    A third of a human life is spent asleep; one hour instead of eight returns seven hours a day, about one hundred
    days a year.
  - Over a seventy-year life that is roughly twenty-five extra waking years.
  - >-
    Electricity demand drops by about a third overnight because people sleep; a sleepless planet loses that dip.
  - >-
    Dreaming happens mostly in REM sleep, which comes in cycles late in a night's sleep; an hour has little room
    for it.
  - >-
    The night was the one period of the day that could not be sold as labour; the counterfactual assumes it becomes
    a shift.
  era_sheet:
    timeline: 'the present day: week one, year one, year ten'
    architecture: >-
      real places: a residential street, a power-station control room, a bakery, an office tower, a factory, a parliament,
      a crowded train
    clothing: >-
      dressing gowns at first, then work clothes at three in the morning; overalls, suits, school uniforms at night
    vehicles: trains and buses full at three in the morning, a full office car park at two
    street: >-
      an analogue bedside clock with a bell alarm, a time clock punching cards, lit windows, open café doors
    light: >-
      night street lit by windows and sodium lamps, fluorescent workplaces at night, a dawn nobody is waiting for
    palette: window amber, night cyan, fluorescent white, deep cyan accent
    forbidden: zombies, red eyes, energy-drink clichés, text on clocks or screens, glowing
  cost: >-
    The seven hours were never going to be yours. The night was the one thing nobody could sell; in this timeline
    it becomes a shift, and the extra waking years are spent mostly at work.
beats:
- id: hook
  vo: >-
    What if sleep took one hour. Not eight. One, for everyone, starting tonight. The whole planet wakes up at one
    in the morning, rested, with twenty-three hours to fill.
  card:
    text: WHAT IF SLEEP TOOK ONE HOUR
    style: title
- id: hinge
  vo: >-
    We spend a third of our lives asleep, because sleep clears the brain and files the day. Here the brain learns
    to do it in sixty minutes. This is how it happens.
  card:
    text: TONIGHT · THE HINGE
    style: date
- id: phase1
  vo: >-
    Week one. Seven extra hours a day, for eight billion people. The lights never go off, so power demand jumps
    by a third. Nobody knows what to do with three in the morning.
  card:
    text: WEEK ONE
    style: phase
- id: phase2
  vo: >-
    Year one. The hours fill. A second workday appears, because an employer who can have you for sixteen hours will.
    Cities run three shifts. The economy grows by a quarter and so does the smoke.
  card:
    text: YEAR ONE
    style: phase
- id: phase3
  vo: >-
    Year ten. There is no night. Shops, schools and parliaments run around the clock. A life holds twenty-five more
    waking years. Nobody remembers dreams, because an hour is too short to have one.
  card:
    text: YEAR TEN
    style: phase
- id: turn
  vo: >-
    [exhale] But the seven hours were never going to be yours. The night was the one thing nobody could sell. Now
    it is a shift.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So: twenty-three hours a day. More freedom, or more work?
  card:
    text: 'Twenty-three hours a day: more freedom, or more work?'
    style: question
