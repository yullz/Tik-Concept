dilemma: Would you trade the internet for Rome?
pinned_comment: >-
  I'd take Rome. One law, one coin, eighty thousand kilometres of paved road in the year three hundred. We waited
  fifteen centuries to get that back. Convince me the internet is worth it.
metadata:
  cover_time: 1.2
  second_comment: >-
    No chance. Scheidel's whole argument in Escape from Rome is that Europe only invented everything because Rome
    was gone and the rest of us had to compete. One empire means one very slow post office, forever.
  hashtags:
  - '#alternatehistory'
  - '#history'
  - '#whatif'
  - '#rome'
  - '#neverfell'
  replies_to_prepare:
  - But Rome DID survive until 1453 in the East
  - China had one empire and invented printing and gunpowder anyway
