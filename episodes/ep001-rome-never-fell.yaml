look_key_prompt: >-
  empty establishing frame of central Rome at dusk in a timeline where the empire never fell, travertine and bronze
  facades, maglev rail laid along a Roman street, sodium street lamps just lit, haze over the Tiber, cars absent,
  pedestrians small in the distance
research:
  hinge: >-
    Emperor Aurelian, who reunified the fractured empire in five years, was murdered by his own officers near Byzantium
    in the autumn of 275 AD; in this timeline the plot fails and his reforms (a stable silver coinage, a defended
    Danube, a professional succession) hold.
  hinge_date: 275 AD
  sources:
  - Alaric Watson, Aurelian and the Third Century (Routledge, 1999)
  - >-
    Historia Augusta, Vita Aureliani; Zosimus, New History 1.62 (the assassination at Caenophrurium)
  - Peter Heather, The Fall of the Roman Empire (2005), on fiscal and military causes
  - >-
    Walter Scheidel, Escape from Rome (2019), on why fragmentation enabled Europe's later takeoff
  facts:
  - >-
    Aurelian reunified the Gallic and Palmyrene breakaway states between 270 and 274, earning the title Restitutor
    Orbis.
  - >-
    He was killed in 275 by officers tricked by his secretary Eros, who forged an execution list.
  - >-
    The Western empire's last emperor, Romulus Augustulus, was deposed in 476; the Eastern half lasted until 1453.
  - >-
    Rome's road network ran to roughly eighty thousand kilometres of paved highway at its height.
  - >-
    The Antikythera mechanism shows Hellenistic gearing was known by the first century BC; Hero of Alexandria described
    a steam-driven aeolipile in the first century AD.
  - >-
    Latin remained Europe's scholarly language into the eighteenth century even without the empire.
  - >-
    Scheidel's thesis: Europe's competing states, not a single empire, drove the scientific and industrial revolutions.
  era_sheet:
    timeline: >-
      Rome continuous to the present; a late-imperial bureaucracy that industrialised in the nineteenth century
    architecture: >-
      travertine, brick-faced concrete, bronze doors; basilicas and insulae with retrofitted glass; the Colosseum
      roofed with bronze-coloured louvres
    clothing: >-
      civil dress is a tailored grey tunic-coat to the knee over trousers; officials wear a narrow purple stripe;
      soldiers in matte olive segmented armour over flight suits
    vehicles: >-
      maglev trams on street rails, delta-wing jets with the eagle and SPQR on the tail, cargo drones with a bronze
      finish; no private cars in the centre
    street: >-
      basalt paving, sodium lamps on bronze posts, awnings of undyed linen, inscriptions carved in capitals (always
      illegible at distance)
    light: Rome, autumn, dusk and early morning; warm low sun, long shadows
    palette: travertine cream, oxidised bronze green, imperial gold accent
    forbidden: neon, chrome, glass skyscrapers, cars, modern typography, togas on everyone
  cost: >-
    An empire that never falls never has to compete. The states that fought each other for a thousand years were
    the engine of printing, gunpowder, banking and the steam engine; a single Rome has no rival to beat and no reason
    to change. In this timeline the industrial revolution arrives around nineteen thirty, and the computer has not
    been invented yet.
beats:
- id: hook
  vo: >-
    What if Rome never fell. Not in four seventy-six. Not ever. Tonight, the Senate votes on the Moon.
  card:
    text: WHAT IF ROME NEVER FELL
    style: title
- id: hinge
  vo: >-
    One autumn night, two seventy-five. Aurelian, the emperor who stitched the broken empire back together in five
    years, is murdered by his officers. Here, the plot fails. This is how it happens.
  card:
    text: 275 AD · THE HINGE
    style: date
- id: phase1
  vo: >-
    He rules twenty more years. The silver coin stays honest, so the Danube stays walled. Because succession is
    written into law, the century of soldier-emperors never comes. Eighty thousand kilometres of road stay paved.
  card:
    text: YEAR TWENTY
    style: phase
- id: phase2
  vo: >-
    Year one thousand. The empire is a bureaucracy the size of a continent. One law, one coin, one language from
    Scotland to the Euphrates. And one very slow post office, because nothing moves faster than a horse.
  card:
    text: YEAR ONE THOUSAND
    style: phase
- id: phase3
  vo: >-
    Today, Rome holds twelve million people. Trams glide on basalt streets. The Colosseum wears a bronze roof. The
    jets over the Forum carry Aurelian's eagle, so four billion people pay tax to one city.
  card:
    text: TODAY
    style: phase
- id: turn
  vo: >-
    [exhale] But an empire with no rivals has no reason to invent. Printing, banking, steam, all came from states
    fighting to survive. Here, the first factory opens in nineteen thirty. There is no computer.
  card: null
- id: dilemma
  vo: >-
    That timeline never happened. Ours did. So, honestly: would you trade the internet for Rome?
  card:
    text: Would you trade the internet for Rome?
    style: question
