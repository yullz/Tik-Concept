look_key_prompt: >-
  empty establishing frame of a family house's front door at dawn with a brass key in the lock, a long drive of
  old trees, a hall of framed photographs visible through the open door, soft cyan morning light
research:
  hinge: >-
    From tonight every human life lasts about two hundred years in good health, with ageing paused around the
    middle of life. Births, prices, jobs, houses and laws stay exactly as they are, which is where the trouble
    starts.
  hinge_date: "tonight"
  sources:
    - "WHO, Global Health Estimates: world life expectancy at birth about 73 years (2019)"
    - "INSEE / Guinness: Jeanne Calment, the longest verified human life, 122 years (1875-1997)"
    - "OECD, Pensions at a Glance (2023): pension systems assume roughly 15-25 years of retirement after a working life of about 40"
    - "Olshansky & Carnes, The Quest for Immortality (2001), on what a radical lifespan extension would do to institutions"
    - "UN DESA, World Population Prospects (2024), for the population arithmetic when deaths fall and births do not"
    - "David Sinclair, Lifespan (2019), on the healthspan argument and who gets the first treatments"
  facts:
    - "A human life today averages about seventy-three years; the longest ever verified was one hundred and twenty-two."
    - "Pensions are built for fifteen to twenty-five years of retirement; two hundred-year lives break that arithmetic on day one."
    - "A marriage at twenty-five becomes a hundred-and-seventy-year contract."
    - "If nobody retires or dies, nobody is promoted and nothing is inherited; houses, farms and seats stay with their holders."
    - "Births continuing at today's rate while deaths stop for a century pushes population toward sixteen billion."
    - "New medical treatments reach the rich first and the poor last; a two-hundred-year life would be the biggest such gap in history."
  era_sheet:
    timeline: "the present day: year one, year fifty, year two hundred"
    architecture: "a family house with a long drive (the through-line), a pensions office, a wedding hall, a parliament, a crowded city, a street where two houses face each other"
    clothing: "ordinary clothes across the ages; the same faces at forty for a hundred years"
    vehicles: "none important"
    street: "a brass house key, framed photographs, a pension ledger, wedding rings, a parliament bench, a crowded street, a clinic door"
    light: "soft dawn on the house, office fluorescents, warm wedding light, grey parliament, hard city noon, the two-house street at dusk"
    palette: "brass, photograph sepia, wedding white, deep cyan accent"
    forbidden: "wrinkled-face horror, vampires, glowing, text on documents, religious imagery"
  cost: >-
    The century was never free: the treatments go first to those who can pay, so for a generation the rich live to
    two hundred and the poor die at seventy, on the same street.
beats:
  - id: hook
    vo: >-
      What if you lived to two hundred. Everyone does, from tonight. Healthy at one hundred and fifty. Your pension
      just became a joke.
    card: {text: "WHAT IF YOU LIVED TO TWO HUNDRED", style: title}
  - id: hinge
    vo: >-
      A human life runs about seventy-three years. Here, from tonight, it runs two hundred, in good health, for
      everyone. Nothing else changes. That is the problem. This is how it happens.
    card: {text: "TONIGHT · THE HINGE", style: date}
  - id: phase1
    vo: >-
      Year one. Retirement at sixty-five means a hundred and thirty-five years on a pension, so retirement moves
      to one hundred and fifty. Marriage is now a hundred and seventy years long.
    card: {text: "YEAR ONE", style: phase}
  - id: phase2
    vo: >-
      Year fifty. Nobody dies, so nobody retires, so nobody is promoted. The houses, the farms, the seats in
      parliament belong to people born last century, and they are not leaving. The young wait.
    card: {text: "YEAR FIFTY", style: phase}
  - id: phase3
    vo: >-
      Year two hundred. The first full lives are ending now, with great-great-grandchildren. Births never stopped,
      so Earth holds sixteen billion. The oldest voters remember a planet with half the people.
    card: {text: "YEAR TWO HUNDRED", style: phase}
  - id: turn
    vo: >-
      [exhale] But the century was never free. The treatments go first to those who can pay, so for a generation
      the rich live to two hundred and the poor die at seventy, on the same street.
    card: null
  - id: dilemma
    vo: >-
      That timeline never happened. Ours did. So: the extra century, if your grandchildren wait a lifetime for your
      house. Do you take it?
    card: {text: "The extra century, if your grandchildren wait a lifetime for your house. Do you take it?", style: question}
