dilemma: "The extra century, if your grandchildren wait a lifetime for your house. Do you take it?"
pinned_comment: >-
  I take it, and so would you. Nobody in history has refused a longer life because of the housing market. The
  grandchildren will build their own houses. They will have two hundred years to do it.
metadata:
  cover_time: 0.6
  second_comment: >-
    No. A world where nobody dies is a world where nothing changes hands: no promotions, no inheritance, no new
    ideas in parliament for a century. A long life for the few at the top is just a monarchy with good doctors.
  hashtags: ["#whatif", "#science", "#longevity", "#society", "#tomorrowmorning"]
  replies_to_prepare:
    - "We'd just have fewer kids and it balances"
    - "This is already happening slowly"
